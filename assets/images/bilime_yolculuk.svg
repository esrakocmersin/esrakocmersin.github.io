<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="dropSh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="480" rx="20" fill="url(#bgG)" stroke="#334155" stroke-width="2"/>

  <!-- Başlık -->
  <g transform="translate(40, 24)">
    <rect width="720" height="52" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="24" y="33" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">
      🔬 BİLİME YOLCULUK VE BİLGİ KAYNAKLARI
    </text>
    <rect x="520" y="11" width="180" height="30" rx="8" fill="#3b82f6" filter="url(#dropSh)"/>
    <text x="610" y="31" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">
      Merak &amp; Keşif
    </text>
  </g>

  <!-- 3 Sütun Düzeni -->
  <g transform="translate(40, 95)">
    <!-- Sütun 1 -->
    <g transform="translate(0, 0)">
      <rect width="228" height="325" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#dropSh)"/>
      <rect x="10" y="10" width="208" height="38" rx="8" fill="#1d4ed8"/>
      <text x="114" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">BİLİMİN ÖZELLİKLERİ</text>
      <g transform="translate(14, 60)">
        
          <g transform="translate(0, 0)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#93c5fd">Merak ve Sorgulama</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Bilim soru sormak ve araştırmakla başlar.</text>
          </g>
        
          <g transform="translate(0, 50)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#93c5fd">Gözlem ve Deney</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Bilimsel bilgi kanıtlara ve deneye dayanır.</text>
          </g>
        
          <g transform="translate(0, 100)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#93c5fd">Objektif (Tarafsız)</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Kişisel duygulardan bağımsız gerçeklerdir.</text>
          </g>
        
          <g transform="translate(0, 150)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#93c5fd">Gelişime Açıktır</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Yeni keşiflerle eski bilgiler yenilenebilir.</text>
          </g>
        
          <g transform="translate(0, 200)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#93c5fd">Evrenseldir</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Bilim tüm insanlığın ortak mirasıdır.</text>
          </g>
        
      </g>
    </g>

    <!-- Sütun 2 -->
    <g transform="translate(246, 0)">
      <rect width="228" height="325" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#dropSh)"/>
      <rect x="10" y="10" width="208" height="38" rx="8" fill="#047857"/>
      <text x="114" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">BİLİM İNSANININ ÖZELLİKLERİ</text>
      <g transform="translate(14, 60)">
        
          <g transform="translate(0, 0)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#86efac">Sabırlı ve Azimlidir</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Hatalardan ders çıkarır, asla vazgeçmez.</text>
          </g>
        
          <g transform="translate(0, 50)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#86efac">İyi Bir Gözlemcidir</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Çevresindeki olayları dikkatle inceler.</text>
          </g>
        
          <g transform="translate(0, 100)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#86efac">Dürüst ve Güvenilirdir</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Deney sonuçlarını olduğu gibi raporlar.</text>
          </g>
        
          <g transform="translate(0, 150)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#86efac">Örnek: Aziz Sancar</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Nobel Kimya ödüllü Türk bilim insanı.</text>
          </g>
        
          <g transform="translate(0, 200)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#86efac">Örnek: İbni Sina</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Tıp dünyasının öncüsü büyük hekim.</text>
          </g>
        
      </g>
    </g>

    <!-- Sütun 3 -->
    <g transform="translate(492, 0)">
      <rect width="228" height="325" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#dropSh)"/>
      <rect x="10" y="10" width="208" height="38" rx="8" fill="#b45309"/>
      <text x="114" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">BİLGİ KAYNAKLARININ GÜVENİLİRLİĞİ</text>
      <g transform="translate(14, 60)">
        
          <g transform="translate(0, 0)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fde047">Güvenilir Web Siteleri</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">edu.tr ve gov.tr uzantılı akademik kaynaklar.</text>
          </g>
        
          <g transform="translate(0, 50)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fde047">Kaynak Karşılaştırma</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Tek bir sitedeki bilgiyle yetinilmemeli.</text>
          </g>
        
          <g transform="translate(0, 100)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fde047">Uzman Görüşü</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Konunun uzmanı kişilerin yazdığı eserler.</text>
          </g>
        
          <g transform="translate(0, 150)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fde047">Bilgi Kirliliği</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">İnternetteki her bilgiye hemen inanılmamalı.</text>
          </g>
        
          <g transform="translate(0, 200)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fde047">Kaynakça Gösterme</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Kullandığımız bilginin kaynağını belirtmek dürüstlüktür.</text>
          </g>
        
      </g>
    </g>

    <!-- İpucu Çubuğu -->
    <rect x="0" y="338" width="720" height="26" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="360" y="355" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#facc15" text-anchor="middle">
      💡 Bir bilginin doğruluğunu kanıtlamak için güvenilir en az 2-3 farklı kaynaktan doğrulamak gerekir!
    </text>
  </g>
</svg>