<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgE" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="bulbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="60%" stop-color="#fdd835" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fbc02d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="760" height="460" fill="url(#bgE)" rx="16"/>
  
  <text x="380" y="36" fill="#ffd54f" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Basit Elektrik Devresi Elemanları</text>
  <text x="380" y="58" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">Pil (Enerji) + İletken Tel (Yol) + Anahtar (Kontrol) + Ampul (Tüketici)</text>

  <!-- SOL: KAPALI DEVRE (Lamba Yanar) -->
  <g transform="translate(40, 85)">
    <rect x="0" y="0" width="325" height="340" rx="12" fill="rgba(34,197,94,0.06)" stroke="#22c55e" stroke-width="2"/>
    <text x="162" y="28" fill="#4ade80" font-size="15" font-weight="bold" text-anchor="middle">✅ KAPALI DEVRE (Ampul Yanar)</text>
    
    <!-- Kablo Çerçevesi (Yeşilimsi akım ışığı) -->
    <rect x="40" y="60" width="245" height="200" rx="8" fill="none" stroke="#38bdf8" stroke-width="4"/>
    
    <!-- Üstte Ampul (Işıldıyor) -->
    <circle cx="162" cy="60" r="38" fill="url(#bulbGlow)"/>
    <circle cx="162" cy="60" r="16" fill="#fffde7" stroke="#eab308" stroke-width="2"/>
    <text x="162" y="66" font-size="20" text-anchor="middle">💡</text>
    <text x="162" y="22" fill="#fde047" font-size="12" font-weight="bold" text-anchor="middle">AMPUL</text>

    <!-- Solda Anahtar (Kapalı) -->
    <circle cx="40" cy="140" r="6" fill="#f59e0b"/>
    <circle cx="40" cy="180" r="6" fill="#f59e0b"/>
    <line x1="40" y1="140" x2="40" y2="180" stroke="#ef4444" stroke-width="4"/>
    <text x="15" y="165" fill="#f87171" font-size="11" font-weight="bold" text-anchor="end">Anahtar: KAPALI</text>

    <!-- Altta Pil -->
    <g transform="translate(122, 245)">
      <rect x="0" y="0" width="80" height="30" rx="4" fill="#15803d" stroke="#fff" stroke-width="1.5"/>
      <rect x="80" y="8" width="6" height="14" fill="#e2e8f0"/>
      <text x="40" y="20" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">PİL (+ / -)</text>
    </g>

    <text x="162" y="305" fill="#86efac" font-size="12" text-anchor="middle">Akım kesintisiz akar, devre tamamdır.</text>
  </g>

  <!-- SAĞ: AÇIK DEVRE (Lamba Söner) -->
  <g transform="translate(395, 85)">
    <rect x="0" y="0" width="325" height="340" rx="12" fill="rgba(239,68,68,0.06)" stroke="#ef4444" stroke-width="2"/>
    <text x="162" y="28" fill="#f87171" font-size="15" font-weight="bold" text-anchor="middle">❌ AÇIK DEVRE (Ampul Yanmaz)</text>
    
    <!-- Kablo Çerçevesi -->
    <path d="M40,140 L40,60 L285,60 L285,260 L40,260 L40,180" fill="none" stroke="#64748b" stroke-width="4"/>
    
    <!-- Üstte Ampul (Sönük) -->
    <circle cx="162" cy="60" r="16" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
    <text x="162" y="66" font-size="20" text-anchor="middle">⚫</text>
    <text x="162" y="22" fill="#94a3b8" font-size="12" text-anchor="middle">AMPUL (Sönük)</text>

    <!-- Solda Anahtar (Açık - Kopuk) -->
    <circle cx="40" cy="140" r="6" fill="#f59e0b"/>
    <circle cx="40" cy="180" r="6" fill="#f59e0b"/>
    <!-- Kol açık -->
    <line x1="40" y1="180" x2="16" y2="148" stroke="#ef4444" stroke-width="4"/>
    <text x="15" y="130" fill="#f87171" font-size="11" font-weight="bold" text-anchor="end">Anahtar: AÇIK (Kopuk)</text>

    <!-- Altta Pil -->
    <g transform="translate(122, 245)">
      <rect x="0" y="0" width="80" height="30" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
      <rect x="80" y="8" width="6" height="14" fill="#64748b"/>
      <text x="40" y="20" fill="#cbd5e1" font-size="12" text-anchor="middle">PİL</text>
    </g>

    <text x="162" y="305" fill="#fca5a5" font-size="12" text-anchor="middle">Yol kesintiye uğrar, elektrik akamaz.</text>
  </g>
</svg>