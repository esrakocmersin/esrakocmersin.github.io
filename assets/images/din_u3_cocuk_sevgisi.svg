<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" rx="16"/>

  <!-- Decorative stars -->
  <circle cx="50" cy="50" r="2" fill="#f59e0b" opacity="0.6"/>
  <circle cx="750" cy="80" r="2" fill="#10b981" opacity="0.6"/>
  <circle cx="30" cy="420" r="1.5" fill="#f59e0b" opacity="0.5"/>
  <circle cx="770" cy="430" r="1.5" fill="#10b981" opacity="0.5"/>
  <circle cx="400" cy="20" r="2" fill="#ffffff" opacity="0.3"/>

  <!-- Title Banner -->
  <rect x="150" y="18" width="500" height="44" rx="22" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <text x="400" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1e293b">🕊️ Hazreti Muhammed'in Çocuk Sevgisi</text>

  <!-- Center oval / hub -->
  <ellipse cx="400" cy="248" rx="75" ry="65" fill="#1e3a5f" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/>
  <text x="400" y="238" text-anchor="middle" font-size="34">🕊️</text>
  <text x="400" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f59e0b">Hazreti Muhammed</text>
  <text x="400" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e1">(s.a.v.)</text>

  <!-- Connector lines -->
  <line x1="327" y1="230" x2="200" y2="185" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3" opacity="0.6"/>
  <line x1="327" y1="265" x2="200" y2="315" stroke="#10b981" stroke-width="2" stroke-dasharray="5,3" opacity="0.6"/>
  <line x1="473" y1="230" x2="600" y2="185" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3" opacity="0.6"/>
  <line x1="473" y1="265" x2="600" y2="315" stroke="#10b981" stroke-width="2" stroke-dasharray="5,3" opacity="0.6"/>
  <line x1="400" y1="313" x2="400" y2="380" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5,3" opacity="0.6"/>

  <!-- LEFT TOP: Selamlama -->
  <rect x="60" y="145" width="160" height="90" rx="14" fill="#1e3a5f" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="173" text-anchor="middle" font-size="22">👦 👧</text>
  <text x="140" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f59e0b">İlk Selam O Verir</text>
  <text x="140" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Çocuklara saygıyla</text>
  <text x="140" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">selam verirdi</text>

  <!-- LEFT BOTTOM: Eşitlik -->
  <rect x="60" y="270" width="160" height="90" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="298" text-anchor="middle" font-size="22">⚖️</text>
  <text x="140" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#10b981">Kız = Erkek</text>
  <text x="140" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Kız ve erkek çocuk</text>
  <text x="140" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">arasında fark gözetmezdi</text>

  <!-- RIGHT TOP: Hasan Hüseyin -->
  <rect x="580" y="145" width="160" height="90" rx="14" fill="#1e3a5f" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="173" text-anchor="middle" font-size="22">🤲</text>
  <text x="660" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f59e0b">Hazreti Hasan &amp; Hüseyin</text>
  <text x="660" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Namaz secdede</text>
  <text x="660" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">torunları inene beklerdi</text>

  <!-- RIGHT BOTTOM: Başları okşama -->
  <rect x="580" y="270" width="160" height="90" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="298" text-anchor="middle" font-size="22">🫶</text>
  <text x="660" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#10b981">Sevgi ile Okşardı</text>
  <text x="660" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Başlarını şefkatle</text>
  <text x="660" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">okşar, hal sorardı</text>

  <!-- BOTTOM CENTER: Hadis -->
  <rect x="230" y="385" width="340" height="80" rx="14" fill="#312e81" stroke="#a78bfa" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="410" text-anchor="middle" font-size="18">📖</text>
  <text x="400" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#c4b5fd">"Çocukları sevin ve onlara</text>
  <text x="400" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#c4b5fd">iyi davranın." — Hazreti Muhammed</text>

  <!-- Footer -->
  <text x="400" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">Din Kültürü 4. Sınıf · 3. Ünite: Peygamberlerin Sevgisi</text>
</svg>
