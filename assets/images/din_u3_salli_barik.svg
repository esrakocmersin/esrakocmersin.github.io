<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b45309;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b45309;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="salliGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barikGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad4)" rx="16"/>

  <!-- Geometric mosque pattern (subtle) -->
  <polygon points="400,30 430,70 370,70" fill="#fbbf24" opacity="0.08"/>
  <rect x="385" y="70" width="30" height="20" fill="#fbbf24" opacity="0.06"/>

  <!-- Title Banner -->
  <rect x="120" y="18" width="560" height="48" rx="24" fill="url(#goldBanner)" filter="url(#shadow4)"/>
  <text x="400" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1e293b">🕌 Salli ve Barik Duaları — Namazın Son Oturuşu</text>

  <!-- Namaz Context Box -->
  <rect x="175" y="82" width="450" height="52" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="2" filter="url(#shadow4)"/>
  <text x="400" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fbbf24">📿 Ka'de-i Ahire (Namazın Son Oturuşu)</text>
  <text x="400" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Ettehiyyatü → Allahümme Salli → Allahümme Barik → Rabbenâ → Selam</text>

  <!-- SALLI BOX (LEFT) -->
  <rect x="35" y="152" width="345" height="220" rx="16" fill="url(#salliGrad)" stroke="#fbbf24" stroke-width="2.5" filter="url(#shadow4)"/>
  <!-- Header -->
  <rect x="35" y="152" width="345" height="52" rx="16" fill="#d97706"/>
  <rect x="35" y="186" width="345" height="18" fill="#d97706"/>
  <text x="207" y="178" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#1e293b">Allahümme SALLİ</text>
  <text x="207" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">alâ Muhammed ve alâ âli Muhammed...</text>

  <text x="207" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fbbf24">Anlamı:</text>
  <text x="207" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e2e8f0">"Allah'ım! Hz. Muhammed'e ve</text>
  <text x="207" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e2e8f0">ailesine, Hz. İbrahim ve ailesine</text>
  <text x="207" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e2e8f0">rahmet ettiğin gibi rahmet et."</text>

  <line x1="60" y1="285" x2="355" y2="285" stroke="#fbbf24" stroke-width="1" opacity="0.4"/>

  <text x="207" y="305" text-anchor="middle" font-size="18">🌙 ⭐</text>
  <text x="207" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fde68a">SALLİ = Salât = Rahmet &amp; Şan</text>
  <text x="207" y="343" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Hz. İbrahim'e yapılan dua gibi</text>
  <text x="207" y="359" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Hz. Muhammed'e dua ederiz.</text>

  <!-- BARIK BOX (RIGHT) -->
  <rect x="420" y="152" width="345" height="220" rx="16" fill="url(#barikGrad)" stroke="#60a5fa" stroke-width="2.5" filter="url(#shadow4)"/>
  <!-- Header -->
  <rect x="420" y="152" width="345" height="52" rx="16" fill="#1d4ed8"/>
  <rect x="420" y="186" width="345" height="18" fill="#1d4ed8"/>
  <text x="592" y="178" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#ffffff">Allahümme BARİK</text>
  <text x="592" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#bfdbfe">alâ Muhammed ve alâ âli Muhammed...</text>

  <text x="592" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#60a5fa">Anlamı:</text>
  <text x="592" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e2e8f0">"Allah'ım! Hz. Muhammed'e ve</text>
  <text x="592" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e2e8f0">ailesine, Hz. İbrahim ve ailesine</text>
  <text x="592" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e2e8f0">bereket verdiğin gibi bereket ver."</text>

  <line x1="445" y1="285" x2="740" y2="285" stroke="#60a5fa" stroke-width="1" opacity="0.4"/>

  <text x="592" y="305" text-anchor="middle" font-size="18">✨ 💎</text>
  <text x="592" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#93c5fd">BARİK = Bereket &amp; Hayır</text>
  <text x="592" y="343" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Hz. İbrahim gibi bereketli</text>
  <text x="592" y="359" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">kılınmasını dileriz.</text>

  <!-- SALAVAT Bottom Banner -->
  <rect x="35" y="388" width="730" height="75" rx="14" fill="#0f172a" stroke="#fbbf24" stroke-width="2" filter="url(#shadow4)"/>
  <text x="400" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fbbf24">🤲 Salavat Getirmenin Önemi</text>
  <text x="400" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">s.a.v.  =  Sallallahu Aleyhi ve Sellem  =  SALAVAT</text>
  <text x="400" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Peygamberimizin adı her anıldığında salavat getirmek sevgi ve saygının göstergesidir.</text>

  <!-- Footer -->
  <text x="400" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">Din Kültürü 4. Sınıf · 3. Ünite: Peygamberlerin Sevgisi</text>
</svg>
