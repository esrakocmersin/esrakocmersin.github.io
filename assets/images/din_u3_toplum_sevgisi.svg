<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4338ca;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad2)" rx="16"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="60" fill="#6366f1" opacity="0.05"/>
  <circle cx="700" cy="400" r="80" fill="#8b5cf6" opacity="0.05"/>
  <circle cx="400" cy="250" r="200" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="8,8" opacity="0.2"/>

  <!-- Title -->
  <rect x="150" y="18" width="500" height="44" rx="22" fill="url(#purpleGrad)" filter="url(#shadow2)"/>
  <text x="400" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#ffffff">❤️ Toplum Sevgisi ve İnsanlara Değer Verme</text>

  <!-- Center Heart Hub -->
  <circle cx="400" cy="248" r="65" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="3" filter="url(#shadow2)"/>
  <text x="400" y="238" text-anchor="middle" font-size="36">❤️</text>
  <text x="400" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#c4b5fd">Merhamet &amp;</text>
  <text x="400" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#a5b4fc">Şefkat</text>

  <!-- Connector lines from center to corners -->
  <line x1="341" y1="208" x2="215" y2="158" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5,4" opacity="0.7"/>
  <line x1="341" y1="288" x2="215" y2="338" stroke="#6366f1" stroke-width="2" stroke-dasharray="5,4" opacity="0.7"/>
  <line x1="459" y1="208" x2="585" y2="158" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5,4" opacity="0.7"/>
  <line x1="459" y1="288" x2="585" y2="338" stroke="#6366f1" stroke-width="2" stroke-dasharray="5,4" opacity="0.7"/>

  <!-- TOP LEFT: Hasta Ziyareti -->
  <rect x="65" y="110" width="155" height="100" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" filter="url(#shadow2)"/>
  <text x="142" y="143" text-anchor="middle" font-size="26">🏥</text>
  <text x="142" y="167" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#a78bfa">Hastayı Ziyaret</text>
  <text x="142" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Hastaları ziyaret eder,</text>
  <text x="142" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">dua ederdi</text>

  <!-- TOP RIGHT: Yetimler -->
  <rect x="580" y="110" width="155" height="100" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" filter="url(#shadow2)"/>
  <text x="657" y="143" text-anchor="middle" font-size="26">🤝</text>
  <text x="657" y="167" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#a78bfa">Yetimlerin Yanında</text>
  <text x="657" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Yetimleri korur,</text>
  <text x="657" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">desteklerdi</text>

  <!-- BOTTOM LEFT: Yoksul Destekle -->
  <rect x="65" y="290" width="155" height="100" rx="14" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow2)"/>
  <text x="142" y="323" text-anchor="middle" font-size="26">🍞</text>
  <text x="142" y="347" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#a78bfa">Yoksulu Destekle</text>
  <text x="142" y="364" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Fakire yardım eder,</text>
  <text x="142" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">paylaşırdı</text>

  <!-- BOTTOM RIGHT: Bağışlama -->
  <rect x="580" y="290" width="155" height="100" rx="14" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow2)"/>
  <text x="657" y="323" text-anchor="middle" font-size="26">🕊️</text>
  <text x="657" y="347" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#a78bfa">Bağışla &amp; Af Dile</text>
  <text x="657" y="364" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Kötülüğe iyilikle</text>
  <text x="657" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">karşılık verirdi</text>

  <!-- Bottom Banner: Eşitlik -->
  <rect x="200" y="415" width="400" height="60" rx="14" fill="#312e81" stroke="#a78bfa" stroke-width="2" filter="url(#shadow2)"/>
  <text x="400" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e0e7ff">⚖️ Mecliste Herkes Eşit</text>
  <text x="400" y="457" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#a5b4fc">Zengin = Fakir · Güçlü = Zayıf · Hepsi değerliydi</text>

  <!-- Footer -->
  <text x="400" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">Din Kültürü 4. Sınıf · 3. Ünite: Peygamberlerin Sevgisi</text>
</svg>
