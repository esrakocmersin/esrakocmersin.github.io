<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="dropSh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="480" rx="20" fill="url(#bgG)" stroke="#334155" stroke-width="2"/>

  <!-- Başlık -->
  <g transform="translate(40, 24)">
    <rect width="720" height="52" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="24" y="33" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">
      🌍 DÜNYA'MIZI KEŞFEDELİM: YAPI VE HAREKETLER
    </text>
    <rect x="520" y="11" width="180" height="30" rx="8" fill="#3b82f6" filter="url(#dropSh)"/>
    <text x="610" y="31" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">
      Gezegenimiz
    </text>
  </g>

  <!-- 3 Sütun Düzeni -->
  <g transform="translate(40, 95)">
    <!-- Sütun 1 -->
    <g transform="translate(0, 0)">
      <rect width="228" height="325" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#dropSh)"/>
      <rect x="10" y="10" width="208" height="38" rx="8" fill="#1d4ed8"/>
      <text x="114" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">DÜNYA'NIN KATMANLARI</text>
      <g transform="translate(14, 60)">
        
          <g transform="translate(0, 0)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#93c5fd">Hava Küre (Atmosfer)</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Dünya'yı saran gaz tabakası, oksijen kaynağı.</text>
          </g>
        
          <g transform="translate(0, 50)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#93c5fd">Su Küre (Hidrosfer)</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Okyanuslar, denizler, göller ve nehirler.</text>
          </g>
        
          <g transform="translate(0, 100)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#93c5fd">Taş Küre (Yer Kabuğu)</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Üzerinde yaşadığımız kayaç ve toprak tabakası.</text>
          </g>
        
          <g transform="translate(0, 150)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#93c5fd">Ateş Küre (Manto)</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Erimiş kızgın lavlardan oluşan sıcak katman.</text>
          </g>
        
          <g transform="translate(0, 200)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#93c5fd">Ağır Küre (Çekirdek)</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">En içteki en sıcak ve en yoğun katman.</text>
          </g>
        
      </g>
    </g>

    <!-- Sütun 2 -->
    <g transform="translate(246, 0)">
      <rect width="228" height="325" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#dropSh)"/>
      <rect x="10" y="10" width="208" height="38" rx="8" fill="#047857"/>
      <text x="114" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">DÖNME HAREKETİ (KENDİ EKSENİNDE)</text>
      <g transform="translate(14, 60)">
        
          <g transform="translate(0, 0)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#86efac">Batıdan Doğuya Döner</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Saat yönünün tersine döner.</text>
          </g>
        
          <g transform="translate(0, 50)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#86efac">Süre: 24 Saat (1 Gün)</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">1 tam dönüş 24 saatte tamamlanır.</text>
          </g>
        
          <g transform="translate(0, 100)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#86efac">Gece ve Gündüz Oluşur</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Güneşe bakan yüz gündüz, arkası gece olur.</text>
          </g>
        
          <g transform="translate(0, 150)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#86efac">Günlük Sıcaklık Farkı</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Gündüzleri ısınır, geceleri soğur.</text>
          </g>
        
          <g transform="translate(0, 200)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#86efac">Gölge Boyu Değişir</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Güneşin gökyüzündeki konumuna göre gölgeler uzayıp kısalır.</text>
          </g>
        
      </g>
    </g>

    <!-- Sütun 3 -->
    <g transform="translate(492, 0)">
      <rect width="228" height="325" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#dropSh)"/>
      <rect x="10" y="10" width="208" height="38" rx="8" fill="#b45309"/>
      <text x="114" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">DOLANMA HAREKETİ (GÜNEŞ ETRAFINDA)</text>
      <g transform="translate(14, 60)">
        
          <g transform="translate(0, 0)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fde047">Elips Yörünge</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Güneş etrafında elips şeklinde dolanır.</text>
          </g>
        
          <g transform="translate(0, 50)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fde047">Süre: 365 Gün 6 Saat (1 Yıl)</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">1 tam dolanım 1 yıla eşittir.</text>
          </g>
        
          <g transform="translate(0, 100)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fde047">Mevsimler Oluşur</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">İlkbahar, Yaz, Sonbahar, Kış mevsimleri meydana gelir.</text>
          </g>
        
          <g transform="translate(0, 150)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fde047">Eksen Eğikliği</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Dünya'nın 23.5 derecelik eğikliği mevsimleri doğurur.</text>
          </g>
        
          <g transform="translate(0, 200)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fde047">Yıllık Sıcaklık Farkları</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Güneş ışınlarının geliş açısı yıl boyunca değişir.</text>
          </g>
        
      </g>
    </g>

    <!-- İpucu Çubuğu -->
    <rect x="0" y="338" width="720" height="26" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="360" y="355" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#facc15" text-anchor="middle">
      💡 Dönme hareketi ➜ Gece ve Gündüzü (24 Saat); Dolanma hareketi ➜ Mevsimleri (1 Yıl) oluşturur!
    </text>
  </g>
</svg>