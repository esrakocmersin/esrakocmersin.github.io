<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pulseGold {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.4)); }
        50% { transform: scale(1.06); filter: drop-shadow(0 0 16px rgba(245, 158, 11, 0.95)); }
      }
      @keyframes pulseCyan {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.4)); }
        50% { transform: scale(1.06); filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.95)); }
      }
      .orb-kalin { animation: pulseGold 2.8s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .orb-ince { animation: pulseCyan 2.8s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    </style>

    <linearGradient id="bgH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="gradKalin" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="90%" stop-color="#b45309"/>
    </radialGradient>
    <radialGradient id="gradInce" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="90%" stop-color="#0284c7"/>
    </radialGradient>
    <filter id="shH" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Arka Plan -->
  <rect width="800" height="480" rx="20" fill="url(#bgH)" stroke="#334155" stroke-width="2"/>

  <!-- Üst Başlık -->
  <g transform="translate(30, 18)">
    <rect width="740" height="54" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.8" filter="url(#shH)"/>
    <text x="24" y="35" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff">
      🔤 TÜRK ALFABESİ (29 HARF)
    </text>
    <rect x="550" y="10" width="166" height="34" rx="10" fill="#ef4444"/>
    <text x="633" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">
      8 ÜNLÜ + 21 ÜNSÜZ
    </text>
  </g>

  <!-- ORTA BÖLÜM: 2 BÜYÜK ÜNLÜ KUTUSU (YAN YANA 355px GENİŞLİK) -->
  <!-- KUTU 1: Kalın Ünlüler -->
  <g transform="translate(30, 84)">
    <rect width="355" height="160" rx="16" fill="#1c1917" stroke="#f59e0b" stroke-width="2" filter="url(#shH)"/>
    
    <rect x="14" y="12" width="327" height="36" rx="8" fill="#78350f"/>
    <text x="177" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#fef08a" text-anchor="middle">
      🟠 KALIN ÜNLÜLER (4 Tane)
    </text>

    <!-- 4 Kalın Harf Küresi -->
    <g transform="translate(24, 62)">
      <!-- A -->
      <g class="orb-kalin">
        <circle cx="34" cy="38" r="30" fill="url(#gradKalin)"/>
        <text x="34" y="49" font-family="'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">A</text>
      </g>
      <!-- I -->
      <g class="orb-kalin">
        <circle cx="118" cy="38" r="30" fill="url(#gradKalin)"/>
        <text x="118" y="49" font-family="'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">I</text>
      </g>
      <!-- O -->
      <g class="orb-kalin">
        <circle cx="202" cy="38" r="30" fill="url(#gradKalin)"/>
        <text x="202" y="49" font-family="'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">O</text>
      </g>
      <!-- U -->
      <g class="orb-kalin">
        <circle cx="286" cy="38" r="30" fill="url(#gradKalin)"/>
        <text x="286" y="49" font-family="'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">U</text>
      </g>
    </g>

    <text x="177" y="148" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fed7aa" text-anchor="middle">
      Gırtlaktan tok ve kalın sesle söylenir
    </text>
  </g>

  <!-- KUTU 2: İnce Ünlüler -->
  <g transform="translate(415, 84)">
    <rect width="355" height="160" rx="16" fill="#082f49" stroke="#38bdf8" stroke-width="2" filter="url(#shH)"/>
    
    <rect x="14" y="12" width="327" height="36" rx="8" fill="#0369a1"/>
    <text x="177" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#e0f2fe" text-anchor="middle">
      🔵 İNCE ÜNLÜLER (4 Tane)
    </text>

    <!-- 4 İnce Harf Küresi -->
    <g transform="translate(24, 62)">
      <!-- E -->
      <g class="orb-ince">
        <circle cx="34" cy="38" r="30" fill="url(#gradInce)"/>
        <text x="34" y="49" font-family="'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">E</text>
      </g>
      <!-- İ -->
      <g class="orb-ince">
        <circle cx="118" cy="38" r="30" fill="url(#gradInce)"/>
        <text x="118" y="49" font-family="'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">İ</text>
      </g>
      <!-- Ö -->
      <g class="orb-ince">
        <circle cx="202" cy="38" r="30" fill="url(#gradInce)"/>
        <text x="202" y="49" font-family="'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">Ö</text>
      </g>
      <!-- Ü -->
      <g class="orb-ince">
        <circle cx="286" cy="38" r="30" fill="url(#gradInce)"/>
        <text x="286" y="49" font-family="'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">Ü</text>
      </g>
    </g>

    <text x="177" y="148" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#bae6fd" text-anchor="middle">
      Ağzın önünden ince ve zarifçe söylenir
    </text>
  </g>

  <!-- ALT BÖLÜM: 21 ÜNSÜZ HARF DÜNYASI -->
  <g transform="translate(30, 256)">
    <rect width="740" height="152" rx="16" fill="#18181b" stroke="#8b5cf6" stroke-width="2" filter="url(#shH)"/>
    
    <text x="370" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#c084fc" text-anchor="middle">
      🤫 21 ÜNSÜZ (SESSİZ) HARF · Yanına ünlü almadan söylenemez (be, ce, de...)
    </text>

    <!-- 21 Harf: 2 Satır Halinde Ferah ve Büyük -->
    <!-- Satır 1 (11 Harf) -->
    <g transform="translate(25, 42)">
      <rect x="0" y="0" width="56" height="42" rx="8" fill="#27272a" stroke="#52525b"/><text x="28" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#f4f4f5" text-anchor="middle">B</text>
      <rect x="63" y="0" width="56" height="42" rx="8" fill="#27272a" stroke="#52525b"/><text x="91" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#f4f4f5" text-anchor="middle">C</text>
      <rect x="126" y="0" width="56" height="42" rx="8" fill="#27272a" stroke="#52525b"/><text x="154" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#f4f4f5" text-anchor="middle">Ç</text>
      <rect x="189" y="0" width="56" height="42" rx="8" fill="#27272a" stroke="#52525b"/><text x="217" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#f4f4f5" text-anchor="middle">D</text>
      <rect x="252" y="0" width="56" height="42" rx="8" fill="#27272a" stroke="#52525b"/><text x="280" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#f4f4f5" text-anchor="middle">F</text>
      <rect x="315" y="0" width="56" height="42" rx="8" fill="#27272a" stroke="#52525b"/><text x="343" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#f4f4f5" text-anchor="middle">G</text>
      <rect x="378" y="0" width="56" height="42" rx="8" fill="#27272a" stroke="#52525b"/><text x="406" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#f4f4f5" text-anchor="middle">Ğ</text>
      <rect x="441" y="0" width="56" height="42" rx="8" fill="#27272a" stroke="#52525b"/><text x="469" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#f4f4f5" text-anchor="middle">H</text>
      <rect x="504" y="0" width="56" height="42" rx="8" fill="#27272a" stroke="#52525b"/><text x="532" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#f4f4f5" text-anchor="middle">J</text>
      <rect x="567" y="0" width="56" height="42" rx="8" fill="#27272a" stroke="#52525b"/><text x="595" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#f4f4f5" text-anchor="middle">K</text>
      <rect x="630" y="0" width="56" height="42" rx="8" fill="#27272a" stroke="#52525b"/><text x="658" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#f4f4f5" text-anchor="middle">L</text>
    </g>

    <!-- Satır 2 (10 Harf) -->
    <g transform="translate(56, 94)">
      <rect x="0" y="0" width="56" height="42" rx="8" fill="#27272a" stroke="#52525b"/><text x="28" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#f4f4f5" text-anchor="middle">M</text>
      <rect x="63" y="0" width="56" height="42" rx="8" fill="#27272a" stroke="#52525b"/><text x="91" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#f4f4f5" text-anchor="middle">N</text>
      <rect x="126" y="0" width="56" height="42" rx="8" fill="#27272a" stroke="#52525b"/><text x="154" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#f4f4f5" text-anchor="middle">P</text>
      <rect x="189" y="0" width="56" height="42" rx="8" fill="#27272a" stroke="#52525b"/><text x="217" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#f4f4f5" text-anchor="middle">R</text>
      <rect x="252" y="0" width="56" height="42" rx="8" fill="#27272a" stroke="#52525b"/><text x="280" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#f4f4f5" text-anchor="middle">S</text>
      <rect x="315" y="0" width="56" height="42" rx="8" fill="#27272a" stroke="#52525b"/><text x="343" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#f4f4f5" text-anchor="middle">Ş</text>
      <rect x="378" y="0" width="56" height="42" rx="8" fill="#27272a" stroke="#52525b"/><text x="406" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#f4f4f5" text-anchor="middle">T</text>
      <rect x="441" y="0" width="56" height="42" rx="8" fill="#27272a" stroke="#52525b"/><text x="469" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#f4f4f5" text-anchor="middle">V</text>
      <rect x="504" y="0" width="56" height="42" rx="8" fill="#27272a" stroke="#52525b"/><text x="532" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#f4f4f5" text-anchor="middle">Y</text>
      <rect x="567" y="0" width="56" height="42" rx="8" fill="#27272a" stroke="#52525b"/><text x="595" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#f4f4f5" text-anchor="middle">Z</text>
    </g>
  </g>

  <!-- EN ALT ALTIN KURAL ŞERİDİ -->
  <g transform="translate(30, 418)">
    <rect width="740" height="46" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1.8"/>
    <text x="370" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#86efac" text-anchor="middle">
      ⭐ ALTIN KURAL: Türkçede her hecede mutlaka 1 tane ünlü (sesli) harf bulunur!
    </text>
  </g>
</svg>