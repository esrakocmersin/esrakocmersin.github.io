<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="trainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="wagonGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="wagonGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="wagonGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Arka Plan -->
  <rect width="800" height="480" rx="20" fill="url(#bgGrad2)" stroke="#334155" stroke-width="2"/>

  <!-- Üst Başlık -->
  <g transform="translate(40, 25)">
    <rect width="720" height="52" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="24" y="33" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#f8fafc">
      🚂 HECE BİLGİSİ VE SATIR SONU KURALLARI
    </text>
    <rect x="540" y="11" width="165" height="30" rx="8" fill="#10b981" filter="url(#shadow2)"/>
    <text x="622" y="31" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">
      1 Ünlü = 1 Hece
    </text>
  </g>

  <!-- BÖLÜM 1: Hece Treni (Cum - hu - ri - yet) -->
  <g transform="translate(40, 95)">
    <rect width="720" height="175" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow2)"/>
    
    <text x="24" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#60a5fa">
      1. HECE SAYISI BULMA: "Cumhuriyet" (4 Hece)
    </text>
    
    <!-- Tren Rayı -->
    <line x1="20" y1="135" x2="700" y2="135" stroke="#475569" stroke-width="4"/>
    <line x1="20" y1="140" x2="700" y2="140" stroke="#334155" stroke-width="2"/>

    <!-- Lokomotif -->
    <g transform="translate(30, 48)">
      <path d="M 10 70 L 10 30 Q 10 20 20 20 L 70 20 L 70 45 L 95 45 Q 105 45 105 55 L 105 70 Z" fill="url(#trainGrad)" filter="url(#shadow2)"/>
      <rect x="20" y="26" width="30" height="24" rx="4" fill="#fef08a"/>
      <circle cx="35" cy="74" r="12" fill="#18181b" stroke="#a1a1aa" stroke-width="3"/>
      <circle cx="85" cy="74" r="12" fill="#18181b" stroke="#a1a1aa" stroke-width="3"/>
      <text x="50" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">TÜRKÇE</text>
    </g>

    <!-- Bağlantı -->
    <line x1="140" y1="105" x2="160" y2="105" stroke="#94a3b8" stroke-width="4"/>

    <!-- Vagon 1: CUM -->
    <g transform="translate(160, 58)">
      <rect width="115" height="52" rx="8" fill="url(#wagonGrad1)" filter="url(#shadow2)"/>
      <text x="57" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">CUM</text>
      <text x="57" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#bfdbfe" text-anchor="middle">1. Hece (u)</text>
      <circle cx="28" cy="62" r="9" fill="#18181b" stroke="#a1a1aa" stroke-width="2"/>
      <circle cx="87" cy="62" r="9" fill="#18181b" stroke="#a1a1aa" stroke-width="2"/>
    </g>

    <!-- Bağlantı -->
    <line x1="280" y1="105" x2="300" y2="105" stroke="#94a3b8" stroke-width="4"/>

    <!-- Vagon 2: HU -->
    <g transform="translate(300, 58)">
      <rect width="115" height="52" rx="8" fill="url(#wagonGrad2)" filter="url(#shadow2)"/>
      <text x="57" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">HU</text>
      <text x="57" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#a7f3d0" text-anchor="middle">2. Hece (u)</text>
      <circle cx="28" cy="62" r="9" fill="#18181b" stroke="#a1a1aa" stroke-width="2"/>
      <circle cx="87" cy="62" r="9" fill="#18181b" stroke="#a1a1aa" stroke-width="2"/>
    </g>

    <!-- Bağlantı -->
    <line x1="420" y1="105" x2="440" y2="105" stroke="#94a3b8" stroke-width="4"/>

    <!-- Vagon 3: Rİ -->
    <g transform="translate(440, 58)">
      <rect width="115" height="52" rx="8" fill="url(#wagonGrad3)" filter="url(#shadow2)"/>
      <text x="57" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">Rİ</text>
      <text x="57" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#fde68a" text-anchor="middle">3. Hece (i)</text>
      <circle cx="28" cy="62" r="9" fill="#18181b" stroke="#a1a1aa" stroke-width="2"/>
      <circle cx="87" cy="62" r="9" fill="#18181b" stroke="#a1a1aa" stroke-width="2"/>
    </g>

    <!-- Bağlantı -->
    <line x1="560" y1="105" x2="580" y2="105" stroke="#94a3b8" stroke-width="4"/>

    <!-- Vagon 4: YET -->
    <g transform="translate(580, 58)">
      <rect width="115" height="52" rx="8" fill="url(#wagonGrad1)" filter="url(#shadow2)"/>
      <text x="57" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">YET</text>
      <text x="57" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#bfdbfe" text-anchor="middle">4. Hece (e)</text>
      <circle cx="28" cy="62" r="9" fill="#18181b" stroke="#a1a1aa" stroke-width="2"/>
      <circle cx="87" cy="62" r="9" fill="#18181b" stroke="#a1a1aa" stroke-width="2"/>
    </g>

    <!-- Alt İpucu Şeridi -->
    <rect x="20" y="146" width="680" height="20" rx="6" fill="#0f172a"/>
    <text x="360" y="161" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#facc15" text-anchor="middle">
      🎯 ALTIN KURAL: Ünlü harfleri say = Hece sayısını anında bul! ("u, u, i, e" = 4 ünlü = 4 hece)
    </text>
  </g>

  <!-- BÖLÜM 2: Satır Sonu Kuralları -->
  <g transform="translate(40, 285)">
    <rect width="720" height="175" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow2)"/>
    
    <text x="24" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#c084fc">
      2. SATIR SONUNA SIĞMAYAN SÖZCÜKLERİN BÖLÜNMESİ
    </text>

    <!-- Kart 1: Yanlış tek harf üstte -->
    <g transform="translate(24, 45)">
      <rect width="155" height="112" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
      <rect x="8" y="8" width="50" height="20" rx="4" fill="#ef4444"/>
      <text x="33" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">❌ YANLIŞ</text>
      <text x="77" y="55" font-family="monospace" font-size="17" font-weight="700" fill="#fca5a5" text-anchor="middle">................ a-</text>
      <text x="77" y="76" font-family="monospace" font-size="17" font-weight="700" fill="#fca5a5" text-anchor="middle">raba</text>
      <text x="77" y="100" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#fecaca" text-anchor="middle">Üstte tek harf kalamaz!</text>
    </g>

    <!-- Kart 2: Doğru bölünüş -->
    <g transform="translate(195, 45)">
      <rect width="155" height="112" rx="10" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
      <rect x="8" y="8" width="50" height="20" rx="4" fill="#22c55e"/>
      <text x="33" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">✅ DOĞRU</text>
      <text x="77" y="55" font-family="monospace" font-size="17" font-weight="700" fill="#86efac" text-anchor="middle">............. ara-</text>
      <text x="77" y="76" font-family="monospace" font-size="17" font-weight="700" fill="#86efac" text-anchor="middle">ba</text>
      <text x="77" y="100" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#bbf7d0" text-anchor="middle">En az 2 harfli hece olmalı</text>
    </g>

    <!-- Kart 3: Yanlış tek harf altta -->
    <g transform="translate(366, 45)">
      <rect width="155" height="112" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
      <rect x="8" y="8" width="50" height="20" rx="4" fill="#ef4444"/>
      <text x="33" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">❌ YANLIŞ</text>
      <text x="77" y="55" font-family="monospace" font-size="16" font-weight="700" fill="#fca5a5" text-anchor="middle">........ öğretm-</text>
      <text x="77" y="76" font-family="monospace" font-size="16" font-weight="700" fill="#fca5a5" text-anchor="middle">en</text>
      <text x="77" y="100" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#fecaca" text-anchor="middle">Altta tek harf bırakılmaz!</text>
    </g>

    <!-- Kart 4: Kesme işareti kuralı -->
    <g transform="translate(537, 45)">
      <rect width="155" height="112" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="8" y="8" width="60" height="20" rx="4" fill="#0284c7"/>
      <text x="38" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">📌 ÖZEL KURAL</text>
      <text x="77" y="55" font-family="monospace" font-size="16" font-weight="700" fill="#7dd3fc" text-anchor="middle">........ Ankara'</text>
      <text x="77" y="76" font-family="monospace" font-size="16" font-weight="700" fill="#7dd3fc" text-anchor="middle">dan</text>
      <text x="77" y="100" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#bae6fd" text-anchor="middle">Kesme varsa kısa çizgi konmaz</text>
    </g>
  </g>
</svg>
