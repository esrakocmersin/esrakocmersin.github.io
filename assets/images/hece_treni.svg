<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <style>
      @keyframes steamPuff {
        0% { transform: translateY(0px) scale(0.6); opacity: 0.8; }
        50% { transform: translateY(-16px) scale(1.1); opacity: 0.4; }
        100% { transform: translateY(-30px) scale(1.4); opacity: 0; }
      }
      @keyframes wagonGlow {
        0%, 100% { filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.4)); }
        50% { filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.95)); }
      }
      .steam-puff { animation: steamPuff 2.5s ease-out infinite; transform-origin: center; transform-box: fill-box; }
      .wagon-glow { animation: wagonGlow 3s ease-in-out infinite; }
    </style>

    <linearGradient id="bgT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="locoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="shT" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Arka Plan -->
  <rect width="800" height="480" rx="20" fill="url(#bgT)" stroke="#334155" stroke-width="2"/>

  <!-- Üst Başlık -->
  <g transform="translate(30, 18)">
    <rect width="740" height="54" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.8" filter="url(#shT)"/>
    <text x="24" y="35" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff">
      🚂 HECE TRENİ VE SATIR SONU KURALLARI
    </text>
    <rect x="540" y="10" width="176" height="34" rx="10" fill="#10b981"/>
    <text x="628" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">
      1 ÜNLÜ = 1 HECE
    </text>
  </g>

  <!-- 1. BÖLÜM: HECE TRENİ (CUM-HU-Rİ-YET) -->
  <g transform="translate(30, 84)">
    <rect width="740" height="155" rx="16" fill="#111827" stroke="#38bdf8" stroke-width="2" filter="url(#shT)"/>
    
    <text x="24" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="900" fill="#38bdf8">
      1. KURAL: SÖZCÜKTEKİ ÜNLÜ HARF SAYISI = HECE SAYISIDIR
    </text>
    
    <!-- Ray -->
    <line x1="20" y1="118" x2="720" y2="118" stroke="#64748b" stroke-width="4"/>
    <line x1="20" y1="124" x2="720" y2="124" stroke="#334155" stroke-width="3"/>

    <!-- Lokomotif -->
    <g transform="translate(24, 40)">
      <circle cx="48" cy="12" r="10" fill="#cbd5e1" class="steam-puff"/>
      <path d="M 10 68 L 10 26 Q 10 16 20 16 L 68 16 L 68 38 L 98 38 Q 106 38 106 48 L 106 68 Z" fill="url(#locoGrad)"/>
      <rect x="36" y="6" width="16" height="12" rx="2" fill="#7f1d1d"/>
      <rect x="20" y="22" width="28" height="20" rx="4" fill="#fef08a"/>
      <circle cx="34" cy="70" r="11" fill="#18181b" stroke="#facc15" stroke-width="2.5"/>
      <circle cx="86" cy="70" r="11" fill="#18181b" stroke="#facc15" stroke-width="2.5"/>
      <text x="50" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">TÜRKÇE</text>
    </g>

    <line x1="135" y1="92" x2="155" y2="92" stroke="#94a3b8" stroke-width="4"/>

    <!-- Vagon 1: CUM -->
    <g transform="translate(155, 46)" class="wagon-glow">
      <rect width="128" height="50" rx="10" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="64" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">CUM</text>
      <text x="64" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#e0f2fe" text-anchor="middle">1. Hece (u)</text>
      <circle cx="32" cy="56" r="9" fill="#18181b" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="96" cy="56" r="9" fill="#18181b" stroke="#38bdf8" stroke-width="2"/>
    </g>

    <line x1="287" y1="92" x2="307" y2="92" stroke="#94a3b8" stroke-width="4"/>

    <!-- Vagon 2: HU -->
    <g transform="translate(307, 46)" class="wagon-glow">
      <rect width="128" height="50" rx="10" fill="#059669" stroke="#34d399" stroke-width="1.5"/>
      <text x="64" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">HU</text>
      <text x="64" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#d1fae5" text-anchor="middle">2. Hece (u)</text>
      <circle cx="32" cy="56" r="9" fill="#18181b" stroke="#34d399" stroke-width="2"/>
      <circle cx="96" cy="56" r="9" fill="#18181b" stroke="#34d399" stroke-width="2"/>
    </g>

    <line x1="439" y1="92" x2="459" y2="92" stroke="#94a3b8" stroke-width="4"/>

    <!-- Vagon 3: Rİ -->
    <g transform="translate(459, 46)" class="wagon-glow">
      <rect width="128" height="50" rx="10" fill="#d97706" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="64" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">Rİ</text>
      <text x="64" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#fef3c7" text-anchor="middle">3. Hece (i)</text>
      <circle cx="32" cy="56" r="9" fill="#18181b" stroke="#fbbf24" stroke-width="2"/>
      <circle cx="96" cy="56" r="9" fill="#18181b" stroke="#fbbf24" stroke-width="2"/>
    </g>

    <line x1="591" y1="92" x2="611" y2="92" stroke="#94a3b8" stroke-width="4"/>

    <!-- Vagon 4: YET -->
    <g transform="translate(611, 46)" class="wagon-glow">
      <rect width="112" height="50" rx="10" fill="#7c3aed" stroke="#c084fc" stroke-width="1.5"/>
      <text x="56" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">YET</text>
      <text x="56" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#f3e8ff" text-anchor="middle">4. Hece (e)</text>
      <circle cx="28" cy="56" r="9" fill="#18181b" stroke="#c084fc" stroke-width="2"/>
      <circle cx="84" cy="56" r="9" fill="#18181b" stroke="#c084fc" stroke-width="2"/>
    </g>

    <!-- Bilgi -->
    <text x="370" y="142" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#facc15" text-anchor="middle">
      "Cumhuriyet" kelimesinde 4 ünlü harf (u, u, i, e) olduğu için tam 4 hecelidir!
    </text>
  </g>

  <!-- 2. BÖLÜM: SATIR SONU BÖLÜNMESİ (2 BÜYÜK KART: YAN YANA 355px) -->
  <!-- KART 1: YANLIŞ BÖLÜNMELER -->
  <g transform="translate(30, 252)">
    <rect width="355" height="160" rx="16" fill="#450a0a" stroke="#ef4444" stroke-width="2" filter="url(#shT)"/>
    
    <rect x="14" y="12" width="327" height="34" rx="8" fill="#ef4444"/>
    <text x="177" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">
      ❌ YANLIŞ BÖLÜNMELER
    </text>

    <!-- Örnek 1 -->
    <g transform="translate(20, 56)">
      <rect width="315" height="42" rx="8" fill="#1f0707"/>
      <text x="14" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#fca5a5">
        ......... a- / raba ➔ YANLIŞ!
      </text>
      <text x="210" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#fecaca">
        (Üstte tek harf kalamaz)
      </text>
    </g>

    <!-- Örnek 2 -->
    <g transform="translate(20, 106)">
      <rect width="315" height="42" rx="8" fill="#1f0707"/>
      <text x="14" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#fca5a5">
        ... öğretm- / en ➔ YANLIŞ!
      </text>
      <text x="210" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#fecaca">
        (Altta tek harf bırakılmaz)
      </text>
    </g>
  </g>

  <!-- KART 2: DOĞRU BÖLÜNMELER -->
  <g transform="translate(415, 252)">
    <rect width="355" height="160" rx="16" fill="#052e16" stroke="#22c55e" stroke-width="2" filter="url(#shT)"/>
    
    <rect x="14" y="12" width="327" height="34" rx="8" fill="#22c55e"/>
    <text x="177" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">
      ✅ DOĞRU BÖLÜNMELER
    </text>

    <!-- Doğru 1 -->
    <g transform="translate(20, 56)">
      <rect width="315" height="42" rx="8" fill="#022110"/>
      <text x="14" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#86efac">
        ......... ara- / ba ➔ DOĞRU!
      </text>
      <text x="206" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#bbf7d0">
        (Hece bütünlüğü tam)
      </text>
    </g>

    <!-- Doğru 2: Özel İsim Kesme -->
    <g transform="translate(20, 106)">
      <rect width="315" height="42" rx="8" fill="#022110"/>
      <text x="14" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="900" fill="#86efac">
        ... Ankara' / dan ➔ DOĞRU!
      </text>
      <text x="200" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#bbf7d0">
        (Kesme varsa çizgi konmaz)
      </text>
    </g>
  </g>

  <!-- EN ALT ALTIN KURAL ŞERİDİ -->
  <g transform="translate(30, 422)">
    <rect width="740" height="44" rx="12" fill="#3b0764" stroke="#c084fc" stroke-width="1.8"/>
    <text x="370" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#fef08a" text-anchor="middle">
      ⭐ KURAL: Satır sonunda veya başında tek bir harf bırakılamaz!
    </text>
  </g>
</svg>