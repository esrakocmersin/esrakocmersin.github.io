<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgK" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12163a"/>
      <stop offset="100%" stop-color="#1e265c"/>
    </linearGradient>
    <linearGradient id="pieSlice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9100"/>
      <stop offset="100%" stop-color="#ff3d00"/>
    </linearGradient>
  </defs>
  <rect width="700" height="450" fill="url(#bgK)" rx="16"/>
  
  <text x="350" y="38" fill="#ffd54f" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Kesirlerin Yapısı: Pay ve Payda</text>
  <text x="350" y="62" fill="#b0bec5" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">Bir bütünün eş parçalarından kaç tanesinin alındığını gösterir.</text>
  
  <!-- Sol: 8 Dilimli Pasta Görseli -->
  <g transform="translate(190, 240)">
    <!-- 8 dilim (3'ü boyalı, 5'i boş) -->
    <!-- Boş dilimler -->
    <path d="M0,0 L110,0 A110,110 0 0,1 77.7,77.7 Z" fill="#37474f" stroke="#263238" stroke-width="2"/>
    <path d="M0,0 L77.7,77.7 A110,110 0 0,1 0,110 Z" fill="#455a64" stroke="#263238" stroke-width="2"/>
    <path d="M0,0 L0,110 A110,110 0 0,1 -77.7,77.7 Z" fill="#37474f" stroke="#263238" stroke-width="2"/>
    <path d="M0,0 L-77.7,77.7 A110,110 0 0,1 -110,0 Z" fill="#455a64" stroke="#263238" stroke-width="2"/>
    <path d="M0,0 L-110,0 A110,110 0 0,1 -77.7,-77.7 Z" fill="#37474f" stroke="#263238" stroke-width="2"/>
    <!-- Boyalı (Seçili) 3 dilim - Hafifçe dışarı taşmış -->
    <g transform="translate(4, -4)">
      <path d="M0,0 L-77.7,-77.7 A110,110 0 0,1 0,-110 Z" fill="url(#pieSlice)" stroke="#fff" stroke-width="1.5"/>
      <path d="M0,0 L0,-110 A110,110 0 0,1 77.7,-77.7 Z" fill="url(#pieSlice)" stroke="#fff" stroke-width="1.5"/>
      <path d="M0,0 L77.7,-77.7 A110,110 0 0,1 110,0 Z" fill="url(#pieSlice)" stroke="#fff" stroke-width="1.5"/>
    </g>
    <circle cx="0" cy="0" r="14" fill="#212121" stroke="#ffb74d" stroke-width="2"/>
    <text x="0" y="145" fill="#eceff1" font-size="14" font-weight="bold" text-anchor="middle">8 Eş Parçaya Bölünmüş Pasta</text>
  </g>
  
  <!-- Sağ: Kesir İfadesi ve Açıklamalar -->
  <g transform="translate(480, 230)">
    <!-- Kesir Sayısı -->
    <rect x="-80" y="-120" width="160" height="230" rx="12" fill="rgba(10,15,40,0.7)" stroke="#3949ab" stroke-width="2"/>
    
    <!-- PAY (3) -->
    <text x="0" y="-45" fill="#ff7043" font-size="56" font-weight="bold" text-anchor="middle">3</text>
    <!-- Kesir Çizgisi -->
    <line x1="-50" y1="-15" x2="50" y2="-15" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <!-- PAYDA (8) -->
    <text x="0" y="60" fill="#42a5f5" font-size="56" font-weight="bold" text-anchor="middle">8</text>
    
    <!-- Ok ve Açıklama: PAY -->
    <path d="M55,-50 L110,-70" stroke="#ff7043" stroke-width="2"/>
    <g transform="translate(115, -95)">
      <rect x="0" y="0" width="95" height="42" rx="6" fill="#ff7043"/>
      <text x="47" y="18" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">PAY</text>
      <text x="47" y="33" fill="#ffe0b2" font-size="10" text-anchor="middle">Alınan parça</text>
    </g>
    
    <!-- Ok ve Açıklama: KESİR ÇİZGİSİ -->
    <path d="M55,-15 L110,-15" stroke="#fff" stroke-width="1.5"/>
    <text x="115" y="-10" fill="#cfd8dc" font-size="11">Kesir Çizgisi (Bölme)</text>

    <!-- Ok ve Açıklama: PAYDA -->
    <path d="M55,50 L110,65" stroke="#42a5f5" stroke-width="2"/>
    <g transform="translate(115, 45)">
      <rect x="0" y="0" width="95" height="42" rx="6" fill="#1e88e5"/>
      <text x="47" y="18" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">PAYDA</text>
      <text x="47" y="33" fill="#bbdefb" font-size="10" text-anchor="middle">Toplam eş parça</text>
    </g>
    
    <!-- Okunuş -->
    <text x="0" y="95" fill="#ffd54f" font-size="13" font-weight="bold" text-anchor="middle">Okunuşu: "Sekizde Üç"</text>
  </g>
</svg>