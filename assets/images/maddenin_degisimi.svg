<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="dropSh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="480" rx="20" fill="url(#bgG)" stroke="#334155" stroke-width="2"/>

  <!-- Başlık -->
  <g transform="translate(40, 24)">
    <rect width="720" height="52" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="24" y="33" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">
      🧊 MADDENİN DEĞİŞİMİ VE ISI ETKİSİ
    </text>
    <rect x="520" y="11" width="180" height="30" rx="8" fill="#f97316" filter="url(#dropSh)"/>
    <text x="610" y="31" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">
      Fiziksel Değişim
    </text>
  </g>

  <!-- 3 Sütun Düzeni -->
  <g transform="translate(40, 95)">
    <!-- Sütun 1 -->
    <g transform="translate(0, 0)">
      <rect width="228" height="325" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#dropSh)"/>
      <rect x="10" y="10" width="208" height="38" rx="8" fill="#1d4ed8"/>
      <text x="114" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">MADDENİN 3 HÂLİ</text>
      <g transform="translate(14, 60)">
        
          <g transform="translate(0, 0)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#93c5fd">Katı Hâl</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Belirli şekli ve hacmi vardır (Taş, buz, demir).</text>
          </g>
        
          <g transform="translate(0, 50)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#93c5fd">Sıvı Hâl</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Belirli hacmi vardır, konulduğu kabın şeklini alır (Su, süt).</text>
          </g>
        
          <g transform="translate(0, 100)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#93c5fd">Gaz Hâl</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Belirli şekli ve hacmi yoktur, ortama yayılır (Buhar, hava).</text>
          </g>
        
          <g transform="translate(0, 150)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#93c5fd">Tanecik Yapısı</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Katıda sıkı, sıvıda gevşek, gazda çok serbesttir.</text>
          </g>
        
          <g transform="translate(0, 200)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#93c5fd">Akışkanlık</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Sıvılar ve gazlar akışkandır.</text>
          </g>
        
      </g>
    </g>

    <!-- Sütun 2 -->
    <g transform="translate(246, 0)">
      <rect width="228" height="325" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#dropSh)"/>
      <rect x="10" y="10" width="208" height="38" rx="8" fill="#047857"/>
      <text x="114" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">HÂL DEĞİŞİMLERİ</text>
      <g transform="translate(14, 60)">
        
          <g transform="translate(0, 0)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#86efac">Erime (Isı Alır)</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Katının sıvıya dönüşmesi: Buz ➜ Su.</text>
          </g>
        
          <g transform="translate(0, 50)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#86efac">Donma (Isı Verir)</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Sıvının katıya dönüşmesi: Su ➜ Buz.</text>
          </g>
        
          <g transform="translate(0, 100)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#86efac">Buharlaşma (Isı Alır)</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Sıvının gaza dönüşmesi: Su ➜ Buhar.</text>
          </g>
        
          <g transform="translate(0, 150)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#86efac">Yoğuşma (Isı Verir)</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Gazın sıvıya dönüşmesi: Bulut ➜ Yağmur.</text>
          </g>
        
          <g transform="translate(0, 200)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#86efac">Tersinir Süreç</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Hâl değişimleri fizikseldir, madde eski hâline dönebilir.</text>
          </g>
        
      </g>
    </g>

    <!-- Sütun 3 -->
    <g transform="translate(492, 0)">
      <rect width="228" height="325" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#dropSh)"/>
      <rect x="10" y="10" width="208" height="38" rx="8" fill="#b45309"/>
      <text x="114" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">ISI VE SICAKLIK FARKI</text>
      <g transform="translate(14, 60)">
        
          <g transform="translate(0, 0)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fde047">Isı Bir Enerjidir</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Sıcak maddeden soğuk maddeye aktarılır (Kalori/Joule).</text>
          </g>
        
          <g transform="translate(0, 50)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fde047">Sıcaklık Bir Ölçümdür</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Termometre ile ölçülür, birimi Derece Selsiyus (°C).</text>
          </g>
        
          <g transform="translate(0, 100)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fde047">Isı Alışverişi</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Sıcaklıklar eşitlenene kadar ısı akışı devam eder.</text>
          </g>
        
          <g transform="translate(0, 150)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fde047">Saf Madde</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Tek cins maddeden oluşur: Altın, su, tuz.</text>
          </g>
        
          <g transform="translate(0, 200)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fde047">Karışım</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Birden fazla saf maddenin birleşimi: Salata, ayran.</text>
          </g>
        
      </g>
    </g>

    <!-- İpucu Çubuğu -->
    <rect x="0" y="338" width="720" height="26" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="360" y="355" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#facc15" text-anchor="middle">
      💡 Isı bir enerji türüdür; Sıcaklık ise termometreyle ölçülen derecedir, enerji değildir!
    </text>
  </g>
</svg>