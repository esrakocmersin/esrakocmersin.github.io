<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7a1"/>
      <stop offset="40%" stop-color="#ffb300"/>
      <stop offset="85%" stop-color="#ff6f00"/>
      <stop offset="100%" stop-color="#ff6f00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spaceBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#141a46"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#spaceBg)" rx="16"/>
  
  <!-- Başlık -->
  <text x="400" y="38" fill="#ffd54f" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Dünya'nın Yıllık Hareketi ve Mevsimlerin Oluşumu</text>
  <text x="400" y="62" fill="#9fa8da" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">Yörünge Süresi: 365 Gün 6 Saat · Eksen Eğikliği: 23° 27' (Yaklaşık 23.5°)</text>
  
  <!-- Yörünge elipsi -->
  <ellipse cx="400" cy="265" rx="330" ry="155" fill="none" stroke="#3949ab" stroke-width="2" stroke-dasharray="6,6"/>
  
  <!-- Güneş -->
  <circle cx="400" cy="265" r="55" fill="url(#sunGlow)" filter="url(#glow)"/>
  <circle cx="400" cy="265" r="28" fill="#fff9c4"/>
  <text x="400" y="271" fill="#e65100" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">GÜNEŞ</text>
  
  <!-- Güneş Işınları Okları -->
  <path d="M330,265 L150,265 M470,265 L650,265 M400,195 L400,140 M400,335 L400,390" stroke="#ffb74d" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- 1. KONUM: 21 HAZİRAN (SOL) -->
  <g transform="translate(110, 265)">
    <!-- Dünya -->
    <g transform="rotate(-23.5)">
      <line x1="0" y1="-46" x2="0" y2="46" stroke="#ef5350" stroke-width="2.5"/>
      <text x="0" y="-52" fill="#ef5350" font-size="11" font-weight="bold" text-anchor="middle">K</text>
      <text x="0" y="60" fill="#90caf9" font-size="11" font-weight="bold" text-anchor="middle">G</text>
      <!-- Aydınlık / Karanlık yarı -->
      <circle cx="0" cy="0" r="28" fill="#1565c0"/>
      <!-- Aydınlık taraf (Güneşe bakan sağ taraf) -->
      <path d="M0,-28 A28,28 0 0,1 0,28 Z" fill="#42a5f5"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="#fff" stroke-width="1.5"/>
    </g>
    <!-- Etiket kutusu -->
    <rect x="-95" y="65" width="190" height="62" rx="8" fill="rgba(15,23,42,0.85)" stroke="#ef5350" stroke-width="1.5"/>
    <text x="0" y="85" fill="#ef5350" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">21 HAZİRAN (Gün Dönümü)</text>
    <text x="0" y="103" fill="#a5d6a7" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">☀️ Kuzey Y.K.: YAZ başlangıcı</text>
    <text x="0" y="118" fill="#90caf9" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">❄️ Güney Y.K.: KIŞ başlangıcı</text>
  </g>

  <!-- 2. KONUM: 21 ARALIK (SAĞ) -->
  <g transform="translate(690, 265)">
    <!-- Dünya -->
    <g transform="rotate(-23.5)">
      <line x1="0" y1="-46" x2="0" y2="46" stroke="#ef5350" stroke-width="2.5"/>
      <text x="0" y="-52" fill="#ef5350" font-size="11" font-weight="bold" text-anchor="middle">K</text>
      <text x="0" y="60" fill="#90caf9" font-size="11" font-weight="bold" text-anchor="middle">G</text>
      <circle cx="0" cy="0" r="28" fill="#1565c0"/>
      <!-- Aydınlık taraf (Güneşe bakan sol taraf) -->
      <path d="M0,-28 A28,28 0 0,0 0,28 Z" fill="#42a5f5"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="#fff" stroke-width="1.5"/>
    </g>
    <rect x="-95" y="65" width="190" height="62" rx="8" fill="rgba(15,23,42,0.85)" stroke="#42a5f5" stroke-width="1.5"/>
    <text x="0" y="85" fill="#42a5f5" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">21 ARALIK (Gün Dönümü)</text>
    <text x="0" y="103" fill="#90caf9" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">❄️ Kuzey Y.K.: KIŞ başlangıcı</text>
    <text x="0" y="118" fill="#ffb74d" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">☀️ Güney Y.K.: YAZ başlangıcı</text>
  </g>

  <!-- 3. KONUM: 21 MART (ÜST) -->
  <g transform="translate(400, 110)">
    <g transform="rotate(-23.5)">
      <line x1="0" y1="-38" x2="0" y2="38" stroke="#ef5350" stroke-width="2"/>
      <circle cx="0" cy="0" r="24" fill="#1e88e5"/>
      <path d="M-24,0 A24,24 0 0,0 24,0 Z" fill="#64b5f6"/>
      <circle cx="0" cy="0" r="24" fill="none" stroke="#fff" stroke-width="1"/>
    </g>
    <rect x="-105" y="-62" width="210" height="42" rx="8" fill="rgba(15,23,42,0.85)" stroke="#66bb6a" stroke-width="1.5"/>
    <text x="0" y="-44" fill="#81c784" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">21 MART (Ekinoks - Gece=Gündüz)</text>
    <text x="0" y="-28" fill="#e0e0e0" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">🌸 Kuzey: İlkbahar · 🍂 Güney: Sonbahar</text>
  </g>

  <!-- 4. KONUM: 23 EYLÜL (ALT) -->
  <g transform="translate(400, 420)">
    <g transform="rotate(-23.5)">
      <line x1="0" y1="-38" x2="0" y2="38" stroke="#ef5350" stroke-width="2"/>
      <circle cx="0" cy="0" r="24" fill="#1e88e5"/>
      <path d="M-24,0 A24,24 0 0,1 24,0 Z" fill="#64b5f6"/>
      <circle cx="0" cy="0" r="24" fill="none" stroke="#fff" stroke-width="1"/>
    </g>
    <rect x="-105" y="28" width="210" height="42" rx="8" fill="rgba(15,23,42,0.85)" stroke="#ffa726" stroke-width="1.5"/>
    <text x="0" y="46" fill="#ffb74d" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">23 EYLÜL (Ekinoks - Gece=Gündüz)</text>
    <text x="0" y="62" fill="#e0e0e0" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">🍂 Kuzey: Sonbahar · 🌸 Güney: İlkbahar</text>
  </g>
  
  <!-- Yön Dönüş Okları -->
  <path d="M260,165 A330,155 0 0,1 300,140" fill="none" stroke="#ffca28" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="240" y="145" fill="#ffca28" font-size="12" font-weight="bold">Dolanma Yönü ↺</text>
</svg>