<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b263b"/>
    </linearGradient>
    <linearGradient id="nGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d32f2f"/>
      <stop offset="100%" stop-color="#ef5350"/>
    </linearGradient>
    <linearGradient id="sGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1976d2"/>
      <stop offset="100%" stop-color="#42a5f5"/>
    </linearGradient>
  </defs>
  <rect width="760" height="460" fill="url(#bgM)" rx="16"/>
  
  <text x="380" y="36" fill="#ffd54f" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Mıknatısların Kutupları ve Manyetik Kuvvet</text>
  <text x="380" y="58" fill="#90caf9" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">Kutup Kuralı: Zıt Kutuplar Birbirini ÇEKER · Aynı Kutuplar Birbirini İTER</text>

  <!-- ÜST: ZIT KUTUPLAR (ÇEKME) -->
  <g transform="translate(60, 95)">
    <rect x="0" y="0" width="640" height="150" rx="10" fill="rgba(255,255,255,0.03)" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="20" y="26" fill="#81c784" font-size="14" font-weight="bold">1. FARKLI KUTUPLAR (N ile S) ➔ ÇEKME KUVVETİ</text>
    
    <!-- Mıknatıs 1 -->
    <g transform="translate(120, 50)">
      <rect x="0" y="0" width="75" height="50" rx="4" fill="url(#sGrad)"/>
      <text x="37" y="33" fill="#fff" font-size="22" font-weight="bold" text-anchor="middle">S</text>
      <rect x="75" y="0" width="75" height="50" rx="4" fill="url(#nGrad)"/>
      <text x="112" y="33" fill="#fff" font-size="22" font-weight="bold" text-anchor="middle">N</text>
    </g>
    
    <!-- Manyetik Alan Çizgileri & Çekim Okları -->
    <g stroke="#ffca28" stroke-width="2" fill="none">
      <path d="M270,60 C320,40 330,40 380,60" stroke-dasharray="4,4"/>
      <path d="M270,75 L380,75"/>
      <path d="M270,90 C320,110 330,110 380,90" stroke-dasharray="4,4"/>
    </g>
    <!-- Karşılıklı Çekim Okları -->
    <path d="M305,75 L320,70 L320,80 Z" fill="#a5d6a7"/>
    <path d="M345,75 L330,70 L330,80 Z" fill="#a5d6a7"/>
    <text x="325" y="115" fill="#a5d6a7" font-size="13" font-weight="bold" text-anchor="middle">ÇEKER 🤝</text>
    
    <!-- Mıknatıs 2 -->
    <g transform="translate(370, 50)">
      <rect x="0" y="0" width="75" height="50" rx="4" fill="url(#sGrad)"/>
      <text x="37" y="33" fill="#fff" font-size="22" font-weight="bold" text-anchor="middle">S</text>
      <rect x="75" y="0" width="75" height="50" rx="4" fill="url(#nGrad)"/>
      <text x="112" y="33" fill="#fff" font-size="22" font-weight="bold" text-anchor="middle">N</text>
    </g>
  </g>

  <!-- ALT: AYNI KUTUPLAR (İTME) -->
  <g transform="translate(60, 270)">
    <rect x="0" y="0" width="640" height="150" rx="10" fill="rgba(255,255,255,0.03)" stroke="#c62828" stroke-width="1.5"/>
    <text x="20" y="26" fill="#ef9a9a" font-size="14" font-weight="bold">2. AYNI KUTUPLAR (N ile N) ➔ İTME KUVVETİ</text>
    
    <!-- Mıknatıs 1 -->
    <g transform="translate(120, 50)">
      <rect x="0" y="0" width="75" height="50" rx="4" fill="url(#sGrad)"/>
      <text x="37" y="33" fill="#fff" font-size="22" font-weight="bold" text-anchor="middle">S</text>
      <rect x="75" y="0" width="75" height="50" rx="4" fill="url(#nGrad)"/>
      <text x="112" y="33" fill="#fff" font-size="22" font-weight="bold" text-anchor="middle">N</text>
    </g>
    
    <!-- Manyetik Alan Çizgileri İtme & Oklar -->
    <g stroke="#ef5350" stroke-width="2" fill="none">
      <path d="M270,60 C300,50 310,20 310,10" stroke-dasharray="4,4"/>
      <path d="M380,60 C350,50 340,20 340,10" stroke-dasharray="4,4"/>
      <path d="M270,90 C300,100 310,130 310,140" stroke-dasharray="4,4"/>
      <path d="M380,90 C350,100 340,130 340,140" stroke-dasharray="4,4"/>
    </g>
    <!-- Dışa İtme Okları -->
    <path d="M305,75 L290,70 L290,80 Z" fill="#ef5350"/>
    <path d="M345,75 L360,70 L360,80 Z" fill="#ef5350"/>
    <text x="325" y="80" fill="#ef5350" font-size="13" font-weight="bold" text-anchor="middle">İTER 💥</text>
    
    <!-- Mıknatıs 2 (Ters çevrildi: N ile N karşı karşıya) -->
    <g transform="translate(370, 50)">
      <rect x="0" y="0" width="75" height="50" rx="4" fill="url(#nGrad)"/>
      <text x="37" y="33" fill="#fff" font-size="22" font-weight="bold" text-anchor="middle">N</text>
      <rect x="75" y="0" width="75" height="50" rx="4" fill="url(#sGrad)"/>
      <text x="112" y="33" fill="#fff" font-size="22" font-weight="bold" text-anchor="middle">S</text>
    </g>
  </g>
</svg>