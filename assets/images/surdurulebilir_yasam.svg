<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="dropSh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="480" rx="20" fill="url(#bgG)" stroke="#334155" stroke-width="2"/>

  <!-- Başlık -->
  <g transform="translate(40, 24)">
    <rect width="720" height="52" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="24" y="33" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">
      🌱 SÜRDÜRÜLEBİLİR ŞEHİRLER VE YAŞAM
    </text>
    <rect x="520" y="11" width="180" height="30" rx="8" fill="#10b981" filter="url(#dropSh)"/>
    <text x="610" y="31" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">
      Çevre &amp; Gelecek
    </text>
  </g>

  <!-- 3 Sütun Düzeni -->
  <g transform="translate(40, 95)">
    <!-- Sütun 1 -->
    <g transform="translate(0, 0)">
      <rect width="228" height="325" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#dropSh)"/>
      <rect x="10" y="10" width="208" height="38" rx="8" fill="#1d4ed8"/>
      <text x="114" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">SÜRDÜRÜLEBİLİR YAŞAM</text>
      <g transform="translate(14, 60)">
        
          <g transform="translate(0, 0)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#93c5fd">Geleceği Korumak</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Bugünün kaynaklarını tüketmeden geleceğe aktarmak.</text>
          </g>
        
          <g transform="translate(0, 50)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#93c5fd">Doğal Kaynakları Koruma</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Su, hava ve toprağı kirletmemek.</text>
          </g>
        
          <g transform="translate(0, 100)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#93c5fd">Yeşil Alanlar</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Parklar ve ormanlar şehirlerin akciğerleridir.</text>
          </g>
        
          <g transform="translate(0, 150)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#93c5fd">Toplu Taşıma</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Bireysel araç yerine metro ve otobüs kullanımı karbonu azaltır.</text>
          </g>
        
          <g transform="translate(0, 200)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#93c5fd">Bisiklet Kullanımı</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Sıfır emisyon ve sağlıklı yaşam.</text>
          </g>
        
      </g>
    </g>

    <!-- Sütun 2 -->
    <g transform="translate(246, 0)">
      <rect width="228" height="325" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#dropSh)"/>
      <rect x="10" y="10" width="208" height="38" rx="8" fill="#047857"/>
      <text x="114" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">GERİ DÖNÜŞÜM &amp; SIFIR ATIK</text>
      <g transform="translate(14, 60)">
        
          <g transform="translate(0, 0)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#86efac">Geri Dönüştürülebilirler</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Kâğıt, cam, plastik, metal ve pil atıkları.</text>
          </g>
        
          <g transform="translate(0, 50)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#86efac">Ayrı Kutulara At!</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Her atık kendi geri dönüşüm kutusuna atılmalıdır.</text>
          </g>
        
          <g transform="translate(0, 100)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#86efac">Ağaçları Kurtar</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">1 ton kâğıt geri dönüştürüldüğünde 17 ağaç kesilmekten kurtulur.</text>
          </g>
        
          <g transform="translate(0, 150)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#86efac">Sıfır Atık Projesi</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">İsrafı önlemek ve atık miktarını en aza indirmek.</text>
          </g>
        
          <g transform="translate(0, 200)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#86efac">Kompost Gübre</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Organik mutfak atıklarından doğal toprak gübresi üretme.</text>
          </g>
        
      </g>
    </g>

    <!-- Sütun 3 -->
    <g transform="translate(492, 0)">
      <rect width="228" height="325" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#dropSh)"/>
      <rect x="10" y="10" width="208" height="38" rx="8" fill="#b45309"/>
      <text x="114" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">SU VE ENERJİ TASARRUFU</text>
      <g transform="translate(14, 60)">
        
          <g transform="translate(0, 0)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fde047">Tatlı Su Kaynakları</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Dünya suyunun sadece küçük bir kısmı içilebilir sudur.</text>
          </g>
        
          <g transform="translate(0, 50)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fde047">Musluğu Kapat!</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Diş fırçalarken suyu açık bırakma.</text>
          </g>
        
          <g transform="translate(0, 100)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fde047">Gereksiz Işıkları Söndür</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Kullanılmayan odanın lambasını kapat.</text>
          </g>
        
          <g transform="translate(0, 150)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fde047">Enerji Tasarruflu Cihazlar</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">A+++ sınıfı cihazlar daha az elektrik harcar.</text>
          </g>
        
          <g transform="translate(0, 200)">
            <rect width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fde047">Yenilenebilir Enerji</text>
            <text x="10" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">Güneş ve rüzgâr enerjisi çevreye zarar vermez.</text>
          </g>
        
      </g>
    </g>

    <!-- İpucu Çubuğu -->
    <rect x="0" y="338" width="720" height="26" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="360" y="355" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#facc15" text-anchor="middle">
      💡 1 ton kâğıdın geri dönüştürülmesi tam 17 yetişkin ağacın kesilmesini önler!
    </text>
  </g>
</svg>