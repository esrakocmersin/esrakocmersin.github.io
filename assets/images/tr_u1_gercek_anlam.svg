<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pulseG {
        0%, 100% { filter: drop-shadow(0 0 6px rgba(16, 185, 129, 0.4)); }
        50% { filter: drop-shadow(0 0 16px rgba(16, 185, 129, 0.95)); }
      }
      .pulse-g { animation: pulseG 3s ease-in-out infinite; }
    </style>

    <linearGradient id="bgG2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shG2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Arka Plan -->
  <rect width="800" height="480" rx="20" fill="url(#bgG2)" stroke="#10b981" stroke-width="2.5"/>

  <!-- Üst Başlık -->
  <g transform="translate(30, 18)">
    <rect width="740" height="54" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="1.8" filter="url(#shG2)"/>
    <text x="24" y="35" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff">
      🌱 SÖZCÜKTE GERÇEK (TEMEL) ANLAM
    </text>
    <rect x="520" y="10" width="196" height="34" rx="10" fill="#10b981"/>
    <text x="618" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="900" fill="#022c22" text-anchor="middle">
      ✨ AKLA İLK GELEN ANLAM
    </text>
  </g>

  <!-- Ana Tanım Kutusu -->
  <g transform="translate(30, 84)" class="pulse-g">
    <rect width="740" height="66" rx="14" fill="#042f2e" stroke="#10b981" stroke-width="2" filter="url(#shG2)"/>
    <text x="370" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="900" fill="#6ee7b7" text-anchor="middle">
      📖 Sözlükteki İLK, TEMEL ve ASIL anlamdır!
    </text>
    <text x="370" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700" fill="#a7f3d0" text-anchor="middle">
      Herkes için aynı somut durumu ifade eder. Akla ilk gelen fiziksel gerçektir.
    </text>
  </g>

  <!-- 2 BÜYÜK VE FERAH ÖRNEK KARTI (355px Genişlik) -->
  <!-- KART 1: Dondurma -->
  <g transform="translate(30, 164)">
    <rect width="355" height="236" rx="18" fill="#064e3b" stroke="#34d399" stroke-width="2" filter="url(#shG2)"/>
    
    <rect x="16" y="14" width="323" height="46" rx="10" fill="#042f2e" stroke="#10b981" stroke-width="1.5"/>
    <text x="177" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#f0fdf4" text-anchor="middle">
      🍦 "Dondurma eridi."
    </text>

    <!-- Açıklama Alanı -->
    <g transform="translate(16, 72)">
      <rect width="323" height="88" rx="10" fill="#022c22"/>
      <text x="20" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#fef08a">
        ➜ Ne oldu?
      </text>
      <text x="20" y="56" font-family="'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#a7f3d0">
        Sıcaklık etkisiyle katı halden sıvıya geçti.
      </text>
      <text x="20" y="76" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#6ee7b7">
        (Gözle görülebilen fiziksel erime)
      </text>
    </g>

    <!-- Rozet -->
    <rect x="16" y="174" width="323" height="46" rx="10" fill="#059669"/>
    <text x="177" y="202" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
      ✅ GERÇEK ANLAMDIR
    </text>
  </g>

  <!-- KART 2: Taş Çok Ağırdı -->
  <g transform="translate(415, 164)">
    <rect width="355" height="236" rx="18" fill="#064e3b" stroke="#34d399" stroke-width="2" filter="url(#shG2)"/>
    
    <rect x="16" y="14" width="323" height="46" rx="10" fill="#042f2e" stroke="#10b981" stroke-width="1.5"/>
    <text x="177" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#f0fdf4" text-anchor="middle">
      📦 "Taş çok ağırdı."
    </text>

    <!-- Açıklama Alanı -->
    <g transform="translate(16, 72)">
      <rect width="323" height="88" rx="10" fill="#022c22"/>
      <text x="20" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#fef08a">
        ➜ Ne oldu?
      </text>
      <text x="20" y="56" font-family="'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#a7f3d0">
        Kütlesi ve kilosu fazla, tartılabilen ağırlık.
      </text>
      <text x="20" y="76" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#6ee7b7">
        (Kaldırırken kasları zorlayan somut yük)
      </text>
    </g>

    <!-- Rozet -->
    <rect x="16" y="174" width="323" height="46" rx="10" fill="#059669"/>
    <text x="177" y="202" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
      ✅ GERÇEK ANLAMDIR
    </text>
  </g>

  <!-- Alt İpucu Şeridi -->
  <g transform="translate(30, 416)">
    <rect width="740" height="48" rx="12" fill="#042f2e" stroke="#10b981" stroke-width="1.8"/>
    <text x="370" y="30" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#fef08a" text-anchor="middle">
      💡 ALTIN FORMÜL: Sözcüğü duyduğunda aklına gelen İLK FİZİKSEL RESİM gerçek anlamdır!
    </text>
  </g>
</svg>