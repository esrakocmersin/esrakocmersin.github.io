<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pulsePurple {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.4)); }
        50% { transform: scale(1.02); filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.95)); }
      }
      @keyframes floatCardT {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      .card-anim-t1 { animation: floatCardT 3.6s ease-in-out infinite; }
      .card-anim-t2 { animation: floatCardT 3.6s ease-in-out 0.6s infinite; }
      .card-anim-t3 { animation: floatCardT 3.6s ease-in-out 1.2s infinite; }
      .rule-pulse-t { animation: pulsePurple 3s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    </style>

    <linearGradient id="bgGradT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="40%" stop-color="#1e0a45"/>
      <stop offset="100%" stop-color="#0b0720"/>
    </linearGradient>
    <linearGradient id="cardGradT" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="headerGradT" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="shadowT" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Arka Plan -->
  <rect width="800" height="480" rx="20" fill="url(#bgGradT)" stroke="#a855f7" stroke-width="2.5"/>

  <!-- Üst Başlık Şeridi -->
  <g transform="translate(40, 22)">
    <rect width="720" height="56" rx="16" fill="#4c1d95" stroke="#8b5cf6" stroke-width="2" filter="url(#shadowT)"/>
    <text x="24" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff">
      🎯 5. ADIM: TERİM ANLAM VE 3 ANLAM ÖZETİ
    </text>
    <rect x="520" y="11" width="180" height="34" rx="10" fill="url(#headerGradT)" filter="url(#shadowT)"/>
    <text x="610" y="33" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">
      ✨ MESLEK VE BİLİM ŞİFRESİ
    </text>
  </g>

  <!-- Ana Tanım Banner'ı -->
  <g transform="translate(40, 92)" class="rule-pulse-t">
    <rect width="720" height="68" rx="14" fill="#1e1045" stroke="#a855f7" stroke-width="2" filter="url(#shadowT)"/>
    <text x="360" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#e9d5ff" text-anchor="middle">
      📖 BİLİM, SANAT, SPOR veya MESLEK ALANINA ait özel kavramlardır!
    </text>
    <text x="360" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#c4b5fd" text-anchor="middle">
      O mesleğin veya alanın uzmanları tarafından kullanılan özel teknik sözcüklerdir.
    </text>
  </g>

  <!-- 3 BÜYÜK ALAN KARTI -->
  <!-- KART 1: Spor Terimleri -->
  <g transform="translate(40, 175)" class="card-anim-t1">
    <rect width="224" height="215" rx="18" fill="url(#cardGradT)" stroke="#c084fc" stroke-width="2" filter="url(#shadowT)"/>
    <rect x="14" y="14" width="196" height="42" rx="10" fill="#3b0764" stroke="#a855f7" stroke-width="1.5"/>
    <text x="112" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#f3e8ff" text-anchor="middle">
      ⚽ SPOR TERİMLERİ
    </text>
    
    <g transform="translate(14, 68)">
      <rect width="196" height="70" rx="10" fill="#1e0a45"/>
      <text x="98" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">
        Penaltı · Ofsayt
      </text>
      <text x="98" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">
        Korner · Smaç · Faul
      </text>
    </g>

    <rect x="14" y="152" width="196" height="46" rx="10" fill="#7c3aed"/>
    <text x="112" y="174" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">
      🏆 ÖRNEK CÜMLE
    </text>
    <text x="112" y="190" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#ddd6fe" text-anchor="middle">
      "Hakem maçta penaltı verdi."
    </text>
  </g>

  <!-- KART 2: Matematik Terimleri -->
  <g transform="translate(288, 175)" class="card-anim-t2">
    <rect width="224" height="215" rx="18" fill="url(#cardGradT)" stroke="#c084fc" stroke-width="2" filter="url(#shadowT)"/>
    <rect x="14" y="14" width="196" height="42" rx="10" fill="#3b0764" stroke="#a855f7" stroke-width="1.5"/>
    <text x="112" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="900" fill="#f3e8ff" text-anchor="middle">
      📐 MATEMATİK
    </text>
    
    <g transform="translate(14, 68)">
      <rect width="196" height="70" rx="10" fill="#1e0a45"/>
      <text x="98" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">
        Üçgen · Dik Açı
      </text>
      <text x="98" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">
        Kesir · Doğru · Işın
      </text>
    </g>

    <rect x="14" y="152" width="196" height="46" rx="10" fill="#7c3aed"/>
    <text x="112" y="174" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">
      🏆 ÖRNEK CÜMLE
    </text>
    <text x="112" y="190" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#ddd6fe" text-anchor="middle">
      "Üçgenin iç açıları toplamı"
    </text>
  </g>

  <!-- KART 3: Tiyatro ve Müzik -->
  <g transform="translate(536, 175)" class="card-anim-t3">
    <rect width="224" height="215" rx="18" fill="url(#cardGradT)" stroke="#c084fc" stroke-width="2" filter="url(#shadowT)"/>
    <rect x="14" y="14" width="196" height="42" rx="10" fill="#3b0764" stroke="#a855f7" stroke-width="1.5"/>
    <text x="112" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#f3e8ff" text-anchor="middle">
      🎭 TİYATRO &amp; MÜZİK
    </text>
    
    <g transform="translate(14, 68)">
      <rect width="196" height="70" rx="10" fill="#1e0a45"/>
      <text x="98" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">
        Perde · Sahne
      </text>
      <text x="98" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">
        Kostüm · Nota · Solfej
      </text>
    </g>

    <rect x="14" y="152" width="196" height="46" rx="10" fill="#7c3aed"/>
    <text x="112" y="174" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">
      🏆 ÖRNEK CÜMLE
    </text>
    <text x="112" y="190" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#ddd6fe" text-anchor="middle">
      "Tiyatronun ikinci perdesi açıldı"
    </text>
  </g>

  <!-- Alt Karşılaştırma Şeridi (Ünite Özeti) -->
  <g transform="translate(40, 404)">
    <rect width="720" height="52" rx="14" fill="#3b0764" stroke="#c084fc" stroke-width="1.5"/>
    <text x="360" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800" fill="#fef08a" text-anchor="middle">
      ⭐ KARŞILAŞTIRMA: "Gözüm ağrıdı" ➔ GERÇEK · "Gözüme girdi" ➔ MECAZ · "İğnenin gözü" ➔ TERİM
    </text>
  </g>
</svg>