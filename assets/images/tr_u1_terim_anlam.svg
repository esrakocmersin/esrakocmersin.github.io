<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pulseP {
        0%, 100% { filter: drop-shadow(0 0 6px rgba(168, 85, 247, 0.4)); }
        50% { filter: drop-shadow(0 0 16px rgba(168, 85, 247, 0.95)); }
      }
      .pulse-p { animation: pulseP 3s ease-in-out infinite; }
    </style>

    <linearGradient id="bgP2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="50%" stop-color="#1e0a45"/>
      <stop offset="100%" stop-color="#0b0720"/>
    </linearGradient>
    <filter id="shP2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Arka Plan -->
  <rect width="800" height="480" rx="20" fill="url(#bgP2)" stroke="#a855f7" stroke-width="2.5"/>

  <!-- Üst Başlık -->
  <g transform="translate(30, 18)">
    <rect width="740" height="54" rx="14" fill="#4c1d95" stroke="#8b5cf6" stroke-width="1.8" filter="url(#shP2)"/>
    <text x="24" y="35" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff">
      🎯 TERİM ANLAM (ALAN VE MESLEK ŞİFRELERİ)
    </text>
    <rect x="520" y="10" width="196" height="34" rx="10" fill="#a855f7"/>
    <text x="618" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="900" fill="#ffffff" text-anchor="middle">
      ✨ ÖZEL UZMANLIK ALANI
    </text>
  </g>

  <!-- Ana Tanım Kutusu -->
  <g transform="translate(30, 84)" class="pulse-p">
    <rect width="740" height="66" rx="14" fill="#1e1045" stroke="#a855f7" stroke-width="2" filter="url(#shP2)"/>
    <text x="370" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="900" fill="#e9d5ff" text-anchor="middle">
      📖 BİLİM, SANAT, SPOR veya MESLEK ALANINA ait özel sözcüklerdir!
    </text>
    <text x="370" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700" fill="#ddd6fe" text-anchor="middle">
      Sadece o alanla ilgili özel bir kuralı, kavramı veya aracı ifade ederler.
    </text>
  </g>

  <!-- 2 BÜYÜK VE FERAH ÖRNEK KARTI (355px Genişlik) -->
  <!-- KART 1: Spor ve Matematik -->
  <g transform="translate(30, 164)">
    <rect width="355" height="236" rx="18" fill="#3b0764" stroke="#c084fc" stroke-width="2" filter="url(#shP2)"/>
    
    <rect x="16" y="14" width="323" height="46" rx="10" fill="#1e0a45" stroke="#a855f7" stroke-width="1.5"/>
    <text x="177" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#f3e8ff" text-anchor="middle">
      ⚽ SPOR VE 📐 MATEMATİK
    </text>

    <!-- Açıklama Alanı -->
    <g transform="translate(16, 72)">
      <rect width="323" height="88" rx="10" fill="#170529"/>
      <text x="20" y="30" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#facc15">
        ⚽ Spor: Penaltı, Ofsayt, Korner, Smaç
      </text>
      <text x="20" y="56" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#38bdf8">
        📐 Matematik: Üçgen, Açı, Kesir, Doğru
      </text>
      <text x="20" y="78" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#ddd6fe">
        ➜ "Hakem penaltı noktasını gösterdi."
      </text>
    </g>

    <!-- Rozet -->
    <rect x="16" y="174" width="323" height="46" rx="10" fill="#7c3aed"/>
    <text x="177" y="202" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
      🏆 ALAN TERİMLERİDİR
    </text>
  </g>

  <!-- KART 2: Tiyatro ve Müzik -->
  <g transform="translate(415, 164)">
    <rect width="355" height="236" rx="18" fill="#3b0764" stroke="#c084fc" stroke-width="2" filter="url(#shP2)"/>
    
    <rect x="16" y="14" width="323" height="46" rx="10" fill="#1e0a45" stroke="#a855f7" stroke-width="1.5"/>
    <text x="177" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#f3e8ff" text-anchor="middle">
      🎭 TİYATRO VE 🎵 MÜZİK
    </text>

    <!-- Açıklama Alanı -->
    <g transform="translate(16, 72)">
      <rect width="323" height="88" rx="10" fill="#170529"/>
      <text x="20" y="30" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#facc15">
        🎭 Tiyatro: Perde, Sahne, Kostüm, Dekor
      </text>
      <text x="20" y="56" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#34d399">
        🎵 Müzik: Nota, Sol Anahtarı, Solfej
      </text>
      <text x="20" y="78" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#ddd6fe">
        ➜ "Oyunun ikinci perdesi başladı."
      </text>
    </g>

    <!-- Rozet -->
    <rect x="16" y="174" width="323" height="46" rx="10" fill="#7c3aed"/>
    <text x="177" y="202" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
      🏆 SANAT TERİMLERİDİR
    </text>
  </g>

  <!-- Alt Karşılaştırma Şeridi (Ünite Özeti) -->
  <g transform="translate(30, 416)">
    <rect width="740" height="48" rx="12" fill="#4c1d95" stroke="#a855f7" stroke-width="1.8"/>
    <text x="370" y="30" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#fef08a" text-anchor="middle">
      ⭐ KARŞILAŞTIRMA: "Gözüm ağrıdı" (GERÇEK) · "Gözüme girdi" (MECAZ) · "İğnenin gözü" (TERİM)
    </text>
  </g>
</svg>