<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pulseRoot {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(16, 185, 129, 0.4)); }
        50% { transform: scale(1.03); filter: drop-shadow(0 0 18px rgba(16, 185, 129, 0.95)); }
      }
      @keyframes floatCardU2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .root-pulse { animation: pulseRoot 3s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .card-float-1 { animation: floatCardU2 3.8s ease-in-out infinite; }
      .card-float-2 { animation: floatCardU2 3.8s ease-in-out 0.6s infinite; }
      .card-float-3 { animation: floatCardU2 3.8s ease-in-out 1.2s infinite; }
    </style>

    <linearGradient id="bgGradU2S1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGradU2S1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="btnGradGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadowU2S1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Arka Plan -->
  <rect width="800" height="480" rx="20" fill="url(#bgGradU2S1)" stroke="#10b981" stroke-width="2.5"/>

  <!-- Üst Başlık -->
  <g transform="translate(40, 22)">
    <rect width="720" height="56" rx="16" fill="#064e3b" stroke="#34d399" stroke-width="2" filter="url(#shadowU2S1)"/>
    <text x="24" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff">
      🌱 1. ADIM: KÖK NEDİR? BASİT KELİMELER DÜNYASI
    </text>
    <rect x="520" y="11" width="180" height="34" rx="10" fill="url(#btnGradGreen)" filter="url(#shadowU2S1)"/>
    <text x="610" y="33" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#022c22" text-anchor="middle">
      ✨ EN KÜÇÜK ANLAMLI PARÇA
    </text>
  </g>

  <!-- Ana Tanım Banner'ı -->
  <g transform="translate(40, 92)" class="root-pulse">
    <rect width="720" height="68" rx="14" fill="#042f2e" stroke="#10b981" stroke-width="2" filter="url(#shadowU2S1)"/>
    <text x="360" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#6ee7b7" text-anchor="middle">
      🌳 Bir sözcüğün parçalanamayan, anlamlı EN KÜÇÜK parçasına KÖK denir!
    </text>
    <text x="360" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#a7f3d0" text-anchor="middle">
      Yapım eki almamış, anlamı değişmemiş sözcüklere ise BASİT SÖZCÜK denir.
    </text>
  </g>

  <!-- 3 BÜYÜK KART -->
  <!-- KART 1: Kök Örnekleri -->
  <g transform="translate(40, 175)" class="card-float-1">
    <rect width="224" height="215" rx="18" fill="url(#cardGradU2S1)" stroke="#34d399" stroke-width="2" filter="url(#shadowU2S1)"/>
    <rect x="14" y="14" width="196" height="42" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="112" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#6ee7b7" text-anchor="middle">
      🔍 KÖK DURUMU
    </text>
    
    <g transform="translate(14, 68)">
      <rect width="196" height="70" rx="10" fill="#022c22"/>
      <text x="98" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        göz · ev · su
      </text>
      <text x="98" y="50" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
        balık · yol · kuş
      </text>
    </g>

    <rect x="14" y="152" width="196" height="46" rx="10" fill="#059669"/>
    <text x="112" y="174" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">
      ✅ SAF KÖKLER
    </text>
    <text x="112" y="190" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#d1fae5" text-anchor="middle">
      Hiçbir ek almamış temel kelimeler
    </text>
  </g>

  <!-- KART 2: Çekim Eki Alan Basit Kelimeler -->
  <g transform="translate(288, 175)" class="card-float-2">
    <rect width="224" height="215" rx="18" fill="url(#cardGradU2S1)" stroke="#34d399" stroke-width="2" filter="url(#shadowU2S1)"/>
    <rect x="14" y="14" width="196" height="42" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="112" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#6ee7b7" text-anchor="middle">
      📦 ÇEKİM EKİ ALANLAR
    </text>
    
    <g transform="translate(14, 68)">
      <rect width="196" height="70" rx="10" fill="#022c22"/>
      <text x="98" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="900" fill="#ffffff" text-anchor="middle">
        kitap + lar ➔ kitaplar
      </text>
      <text x="98" y="50" font-family="'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="900" fill="#ffffff" text-anchor="middle">
        ev + imiz ➔ evimiz
      </text>
    </g>

    <rect x="14" y="152" width="196" height="46" rx="10" fill="#059669"/>
    <text x="112" y="174" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">
      ✅ YİNE BASİT SÖZCÜK!
    </text>
    <text x="112" y="190" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#d1fae5" text-anchor="middle">
      Anlam değişmedi, sadece çoğaldı
    </text>
  </g>

  <!-- KART 3: Altın Formül -->
  <g transform="translate(536, 175)" class="card-float-3">
    <rect width="224" height="215" rx="18" fill="url(#cardGradU2S1)" stroke="#34d399" stroke-width="2" filter="url(#shadowU2S1)"/>
    <rect x="14" y="14" width="196" height="42" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="112" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="900" fill="#6ee7b7" text-anchor="middle">
      ⚠️ DİKKAT KURALI
    </text>
    
    <g transform="translate(14, 68)">
      <rect width="196" height="70" rx="10" fill="#022c22"/>
      <text x="98" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800" fill="#fef08a" text-anchor="middle">
        "Balık" kelimesinin kökü
      </text>
      <text x="98" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#fca5a5" text-anchor="middle">
        "Bal" OLAMAZ! ❌
      </text>
      <text x="98" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#a7f3d0" text-anchor="middle">
        Çünkü aralarında anlam bağı yok!
      </text>
    </g>

    <rect x="14" y="152" width="196" height="46" rx="10" fill="#059669"/>
    <text x="112" y="174" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">
      🎯 KÖK KURALI
    </text>
    <text x="112" y="190" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#d1fae5" text-anchor="middle">
      Kök ile kelime anlamca bağlıdır
    </text>
  </g>

  <!-- Alt Altın İpucu Bandı -->
  <g transform="translate(40, 404)">
    <rect width="720" height="52" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="360" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#fef08a" text-anchor="middle">
      💡 ALTIN KURAL: Bir kelime yeni bir varlığı anlatmıyorsa (anlamı değişmemişse) daima BASİTTİR!
    </text>
  </g>
</svg>