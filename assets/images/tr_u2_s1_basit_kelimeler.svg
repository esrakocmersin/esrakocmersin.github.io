<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pulseGreen {
        0%, 100% { filter: drop-shadow(0 0 6px rgba(16, 185, 129, 0.4)); }
        50% { filter: drop-shadow(0 0 16px rgba(16, 185, 129, 0.95)); }
      }
      .pulse-gr { animation: pulseGreen 3s ease-in-out infinite; }
    </style>

    <linearGradient id="bgU2S1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shU2S1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Arka Plan -->
  <rect width="800" height="480" rx="20" fill="url(#bgU2S1)" stroke="#10b981" stroke-width="2.5"/>

  <!-- Üst Başlık -->
  <g transform="translate(30, 18)">
    <rect width="740" height="54" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="1.8" filter="url(#shU2S1)"/>
    <text x="24" y="35" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff">
      🌱 KÖK NEDİR? BASİT KELİMELER DÜNYASI
    </text>
    <rect x="520" y="10" width="196" height="34" rx="10" fill="#10b981"/>
    <text x="618" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="900" fill="#022c22" text-anchor="middle">
      ✨ EN KÜÇÜK PARÇA
    </text>
  </g>

  <!-- Ana Tanım Kutusu -->
  <g transform="translate(30, 84)" class="pulse-gr">
    <rect width="740" height="66" rx="14" fill="#042f2e" stroke="#10b981" stroke-width="2" filter="url(#shU2S1)"/>
    <text x="370" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="900" fill="#6ee7b7" text-anchor="middle">
      🌳 Bir sözcüğün parçalanamayan, anlamlı EN KÜÇÜK parçasına KÖK denir!
    </text>
    <text x="370" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700" fill="#a7f3d0" text-anchor="middle">
      Yapım eki almamış, anlamı değişmemiş tüm sözcükler BASİT KELİMEDİR.
    </text>
  </g>

  <!-- 2 BÜYÜK VE FERAH ÖRNEK KARTI (355px Genişlik) -->
  <!-- KART 1: Saf Kökler -->
  <g transform="translate(30, 164)">
    <rect width="355" height="236" rx="18" fill="#064e3b" stroke="#34d399" stroke-width="2" filter="url(#shU2S1)"/>
    
    <rect x="16" y="14" width="323" height="46" rx="10" fill="#042f2e" stroke="#10b981" stroke-width="1.5"/>
    <text x="177" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#6ee7b7" text-anchor="middle">
      🌳 KÖK DURUMUNDAKİLER
    </text>

    <!-- İçerik -->
    <g transform="translate(16, 72)">
      <rect width="323" height="88" rx="10" fill="#022c22"/>
      <text x="161" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#fef08a" text-anchor="middle">
        göz · ev · su · balık · yol
      </text>
      <text x="161" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#a7f3d0" text-anchor="middle">
        Hiçbir ek almamış, tek başına var olan
      </text>
      <text x="161" y="78" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#6ee7b7" text-anchor="middle">
        temel kök sözcüklerdir.
      </text>
    </g>

    <rect x="16" y="174" width="323" height="46" rx="10" fill="#059669"/>
    <text x="177" y="202" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
      ✅ BASİT SÖZCÜKTÜR
    </text>
  </g>

  <!-- KART 2: Çekim Eki Alanlar -->
  <g transform="translate(415, 164)">
    <rect width="355" height="236" rx="18" fill="#064e3b" stroke="#34d399" stroke-width="2" filter="url(#shU2S1)"/>
    
    <rect x="16" y="14" width="323" height="46" rx="10" fill="#042f2e" stroke="#10b981" stroke-width="1.5"/>
    <text x="177" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#6ee7b7" text-anchor="middle">
      📦 ÇEKİM EKİ ALANLAR
    </text>

    <!-- İçerik -->
    <g transform="translate(16, 72)">
      <rect width="323" height="88" rx="10" fill="#022c22"/>
      <text x="161" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="900" fill="#fef08a" text-anchor="middle">
        kitap + lar ➔ kitaplar
      </text>
      <text x="161" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="900" fill="#fef08a" text-anchor="middle">
        ev + imiz ➔ evimiz
      </text>
      <text x="161" y="78" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#a7f3d0" text-anchor="middle">
        (Anlamı değişmedi, sadece sayısı/sahibi belli oldu)
      </text>
    </g>

    <rect x="16" y="174" width="323" height="46" rx="10" fill="#059669"/>
    <text x="177" y="202" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
      ✅ YİNE BASİT SÖZCÜKTÜR
    </text>
  </g>

  <!-- Alt İpucu Şeridi -->
  <g transform="translate(30, 416)">
    <rect width="740" height="48" rx="12" fill="#042f2e" stroke="#10b981" stroke-width="1.8"/>
    <text x="370" y="30" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#fef08a" text-anchor="middle">
      ⚠️ ÇOK ÖNEMLİ KURAL: "Balık" sözcüğünün kökü "BAL" olamaz! Kök ile sözcük arasında mutlaka anlam bağı olmalıdır!
    </text>
  </g>
</svg>