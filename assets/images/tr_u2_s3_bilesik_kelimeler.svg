<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pulseGl {
        0%, 100% { filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.4)); }
        50% { filter: drop-shadow(0 0 16px rgba(245, 158, 11, 0.95)); }
      }
      .pulse-gl { animation: pulseGl 3s ease-in-out infinite; }
    </style>

    <linearGradient id="bgU2S3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#291102"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shU2S3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Arka Plan -->
  <rect width="800" height="480" rx="20" fill="url(#bgU2S3)" stroke="#f59e0b" stroke-width="2.5"/>

  <!-- Üst Başlık -->
  <g transform="translate(30, 18)">
    <rect width="740" height="54" rx="14" fill="#78350f" stroke="#f59e0b" stroke-width="1.8" filter="url(#shU2S3)"/>
    <text x="24" y="35" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff">
      🧩 BİLEŞİK KELİMELER (GÜÇLERİNİ BİRLEŞTİRENLER)
    </text>
    <rect x="520" y="10" width="196" height="34" rx="10" fill="#f59e0b"/>
    <text x="618" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="900" fill="#451a03" text-anchor="middle">
      ✨ 2 KELİME ➔ 1 ANLAM
    </text>
  </g>

  <!-- Ana Tanım Kutusu -->
  <g transform="translate(30, 84)" class="pulse-gl">
    <rect width="740" height="66" rx="14" fill="#291102" stroke="#f59e0b" stroke-width="2" filter="url(#shU2S3)"/>
    <text x="370" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="900" fill="#fde68a" text-anchor="middle">
      🔗 En az İKİ AYRI KELİMENİN birleşip kaynaşmasıyla oluşan sözcüklerdir!
    </text>
    <text x="370" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700" fill="#fed7aa" text-anchor="middle">
      Bileşik kelimeler daima BİTİŞİK yazılır ve tek bir yeni varlığı karşılarlar.
    </text>
  </g>

  <!-- 2 BÜYÜK VE FERAH ÖRNEK KARTI (355px Genişlik) -->
  <!-- KART 1: Aslanağzı -->
  <g transform="translate(30, 164)">
    <rect width="355" height="236" rx="18" fill="#542104" stroke="#fbbf24" stroke-width="2" filter="url(#shU2S3)"/>
    
    <rect x="16" y="14" width="323" height="46" rx="10" fill="#381502" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="177" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#fef08a" text-anchor="middle">
      🌺 "Aslan" + "Ağzı"
    </text>

    <!-- İçerik -->
    <g transform="translate(16, 72)">
      <rect width="323" height="88" rx="10" fill="#240c01"/>
      <text x="161" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#facc15" text-anchor="middle">
        Aslan + Ağzı ➔ ASLANAĞZI
      </text>
      <text x="161" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#fef08a" text-anchor="middle">
        Hayvan ve organ sözcükleri birleşti,
      </text>
      <text x="161" y="78" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#fed7aa" text-anchor="middle">
        rengârenk bir ÇİÇEK adı oldu!
      </text>
    </g>

    <rect x="16" y="174" width="323" height="46" rx="10" fill="#d97706"/>
    <text x="177" y="202" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
      ✅ BİLEŞİK SÖZCÜKTÜR
    </text>
  </g>

  <!-- KART 2: Bilgisayar -->
  <g transform="translate(415, 164)">
    <rect width="355" height="236" rx="18" fill="#542104" stroke="#fbbf24" stroke-width="2" filter="url(#shU2S3)"/>
    
    <rect x="16" y="14" width="323" height="46" rx="10" fill="#381502" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="177" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#fef08a" text-anchor="middle">
      💻 "Bilgi" + "Sayar"
    </text>

    <!-- İçerik -->
    <g transform="translate(16, 72)">
      <rect width="323" height="88" rx="10" fill="#240c01"/>
      <text x="161" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#facc15" text-anchor="middle">
        Bilgi + Sayar ➔ BİLGİSAYAR
      </text>
      <text x="161" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#fef08a" text-anchor="middle">
        İki bağımsız kelime birleşti,
      </text>
      <text x="161" y="78" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#fed7aa" text-anchor="middle">
        akıllı bir ELEKTRONİK CİHAZ oldu!
      </text>
    </g>

    <rect x="16" y="174" width="323" height="46" rx="10" fill="#d97706"/>
    <text x="177" y="202" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
      ✅ BİLEŞİK SÖZCÜKTÜR
    </text>
  </g>

  <!-- Alt İpucu Şeridi -->
  <g transform="translate(30, 416)">
    <rect width="740" height="48" rx="12" fill="#78350f" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="370" y="30" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="900" fill="#fef08a" text-anchor="middle">
      💡 ALTIN KURAL: Bileşik kelimeler daima BİTİŞİK yazılır! (Örnek: Hanımeli, Karadeniz, Sivrisinek, Çanakkale)
    </text>
  </g>
</svg>