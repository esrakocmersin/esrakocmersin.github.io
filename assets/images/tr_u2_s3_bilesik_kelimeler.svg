<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pulseGold {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.4)); }
        50% { transform: scale(1.03); filter: drop-shadow(0 0 18px rgba(245, 158, 11, 0.95)); }
      }
      @keyframes floatCardS3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .gold-pulse { animation: pulseGold 3s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .card-float-s3-1 { animation: floatCardS3 3.8s ease-in-out infinite; }
      .card-float-s3-2 { animation: floatCardS3 3.8s ease-in-out 0.6s infinite; }
      .card-float-s3-3 { animation: floatCardS3 3.8s ease-in-out 1.2s infinite; }
    </style>

    <linearGradient id="bgGradU2S3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#291102"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGradU2S3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="btnGradGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadowU2S3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Arka Plan -->
  <rect width="800" height="480" rx="20" fill="url(#bgGradU2S3)" stroke="#f59e0b" stroke-width="2.5"/>

  <!-- Üst Başlık -->
  <g transform="translate(40, 22)">
    <rect width="720" height="56" rx="16" fill="#78350f" stroke="#f59e0b" stroke-width="2" filter="url(#shadowU2S3)"/>
    <text x="24" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff">
      🧩 3. ADIM: BİLEŞİK KELİMELER (GÜÇLERİNİ BİRLEŞTİRENLER)
    </text>
    <rect x="520" y="11" width="180" height="34" rx="10" fill="url(#btnGradGold)" filter="url(#shadowU2S3)"/>
    <text x="610" y="33" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#451a03" text-anchor="middle">
      ✨ 2 KELİME ➔ 1 ANLAM
    </text>
  </g>

  <!-- Ana Tanım Banner'ı -->
  <g transform="translate(40, 92)" class="gold-pulse">
    <rect width="720" height="68" rx="14" fill="#291102" stroke="#f59e0b" stroke-width="2" filter="url(#shadowU2S3)"/>
    <text x="360" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#fde68a" text-anchor="middle">
      🔗 En az İKİ AYRI KELİMENİN birleşip kaynaşmasıyla oluşan sözcüklere denir!
    </text>
    <text x="360" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#fed7aa" text-anchor="middle">
      Bileşik kelimeler daima BİTİŞİK yazılır ve tek bir yeni varlığı karşılarlar.
    </text>
  </g>

  <!-- 3 BÜYÜK BİLEŞİK KELİME KARTI -->
  <!-- KART 1: Aslanağzı -->
  <g transform="translate(40, 175)" class="card-float-s3-1">
    <rect width="224" height="215" rx="18" fill="url(#cardGradU2S3)" stroke="#fbbf24" stroke-width="2" filter="url(#shadowU2S3)"/>
    <rect x="14" y="14" width="196" height="42" rx="10" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="112" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#fef08a" text-anchor="middle">
      🌺 "aslanağzı"
    </text>
    
    <g transform="translate(14, 68)">
      <rect width="196" height="70" rx="10" fill="#291102"/>
      <text x="98" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="900" fill="#fde68a" text-anchor="middle">
        Aslan + Ağzı
      </text>
      <text x="98" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#ffffff" text-anchor="middle">
        Hayvan ve organ birleşti, rengârenk bir ÇİÇEK adı oldu!
      </text>
    </g>

    <rect x="14" y="152" width="196" height="46" rx="10" fill="#d97706"/>
    <text x="112" y="174" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">
      ✅ BİLEŞİK KELİME
    </text>
    <text x="112" y="190" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#fef3c7" text-anchor="middle">
      İki sözcük tek bir çiçek oldu
    </text>
  </g>

  <!-- KART 2: Bilgisayar -->
  <g transform="translate(288, 175)" class="card-float-s3-2">
    <rect width="224" height="215" rx="18" fill="url(#cardGradU2S3)" stroke="#fbbf24" stroke-width="2" filter="url(#shadowU2S3)"/>
    <rect x="14" y="14" width="196" height="42" rx="10" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="112" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#fef08a" text-anchor="middle">
      💻 "bilgisayar"
    </text>
    
    <g transform="translate(14, 68)">
      <rect width="196" height="70" rx="10" fill="#291102"/>
      <text x="98" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="900" fill="#fde68a" text-anchor="middle">
        Bilgi + Sayar
      </text>
      <text x="98" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#ffffff" text-anchor="middle">
        Verileri işleyen akıllı bir teknolojik cihaz oldu!
      </text>
    </g>

    <rect x="14" y="152" width="196" height="46" rx="10" fill="#d97706"/>
    <text x="112" y="174" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">
      ✅ BİLEŞİK KELİME
    </text>
    <text x="112" y="190" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#fef3c7" text-anchor="middle">
      Bitişik ve kaynaşmış kelime
    </text>
  </g>

  <!-- KART 3: Diğer Popüler Örnekler -->
  <g transform="translate(536, 175)" class="card-float-s3-3">
    <rect width="224" height="215" rx="18" fill="url(#cardGradU2S3)" stroke="#fbbf24" stroke-width="2" filter="url(#shadowU2S3)"/>
    <rect x="14" y="14" width="196" height="42" rx="10" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="112" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="900" fill="#fef08a" text-anchor="middle">
      🌟 DİĞER ÖRNEKLER
    </text>
    
    <g transform="translate(14, 68)">
      <rect width="196" height="70" rx="10" fill="#291102"/>
      <text x="98" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">
        🌸 Hanım + eli ➔ Hanımeli
      </text>
      <text x="98" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">
        🌊 Kara + deniz ➔ Karadeniz
      </text>
      <text x="98" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">
        🏰 Çanak + kale ➔ Çanakkale
      </text>
    </g>

    <rect x="14" y="152" width="196" height="46" rx="10" fill="#d97706"/>
    <text x="112" y="174" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">
      ✅ BİLEŞİK KELİME
    </text>
    <text x="112" y="190" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#fef3c7" text-anchor="middle">
      Her zaman bitişik yazılırlar
    </text>
  </g>

  <!-- Alt İpucu Şeridi -->
  <g transform="translate(40, 404)">
    <rect width="720" height="52" rx="14" fill="#78350f" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="360" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#fef08a" text-anchor="middle">
      💡 FORMÜL: Sözcüğü ortadan ikiye böldüğünde iki ayrı anlamlı kelime çıkıyorsa o BİLEŞİK SÖZCÜKTÜR!
    </text>
  </g>
</svg>