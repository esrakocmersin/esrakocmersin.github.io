<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bilgi Evreni 4D Ultimate</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8C%8C%3C/text%3E%3C/svg%3E">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0b1026;--p:rgba(255,255,255,.07);--b:rgba(255,255,255,.15);--t:#eef2ff;--m:#9aa6d1;--a:#ffca28;--a2:#4fc3f7;--ok:#66bb6a;--bad:#ef5350}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Segoe UI',system-ui,Arial,sans-serif;color:var(--t);min-height:100vh;background:radial-gradient(1200px 700px at 15% -10%,#2a2f78 0,transparent 60%),radial-gradient(900px 600px at 100% 5%,#4a1d6e 0,transparent 55%),var(--bg);background-attachment:fixed}
body.hasImp{padding-top:50px}
.hidden{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:.2em 0 .5em}
small,.muted{color:var(--m)}
#app{max-width:1200px;margin:0 auto;padding:14px}
.impbar{position:fixed;top:0;left:0;right:0;height:50px;z-index:1000;background:linear-gradient(90deg,#b71c1c,#f57f17);display:flex;align-items:center;gap:14px;padding:0 14px;font-weight:600;box-shadow:0 2px 12px rgba(0,0,0,.5)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 14px;margin-bottom:12px;background:var(--p);border:1px solid var(--b);border-radius:14px;backdrop-filter:blur(6px)}
.logo{font-size:20px;font-weight:700}.logo b{color:var(--a)}
.who{display:flex;align-items:center;gap:10px}
.who small{display:block}
.avatar{--s:44px;width:var(--s);height:var(--s);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:calc(var(--s)*.55);background:#27306b;border:3px solid #55609c;flex:none}
.frame-gold{border-color:#ffd54f;box-shadow:0 0 10px #ffd54f}
.frame-rainbow{border:3px solid transparent;background:linear-gradient(#27306b,#27306b) padding-box,linear-gradient(45deg,#f44336,#ff9800,#ffeb3b,#4caf50,#2196f3,#9c27b0) border-box}
.frame-neon{border-color:#00e5ff;box-shadow:0 0 12px #00e5ff,inset 0 0 8px #00e5ff}
.frame-diamond{border-color:#b9f6ff;box-shadow:0 0 14px #b9f6ff,0 0 4px #fff;background:#3b4a9c}
.btn{background:linear-gradient(135deg,#5c6bff,#8e44ff);border:0;color:#fff;padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600;transition:.15s}
.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--p);border:1px solid var(--b)}
.btn.warn{background:linear-gradient(135deg,#ffb300,#ff6f00);color:#111}
.btn.danger{background:linear-gradient(135deg,#e53935,#b71c1c)}
.btn.ok{background:linear-gradient(135deg,#43a047,#1b5e20)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.big{padding:14px 28px;font-size:18px}
.panel{margin-top:12px}
.card{background:var(--p);border:1px solid var(--b);border-radius:14px;padding:16px;margin-bottom:14px}
.card.center{text-align:center}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;align-items:end}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-top:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.between{justify-content:space-between}
.end{display:flex;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--m)}
input,select,textarea{background:rgba(0,0,0,.35);border:1px solid var(--b);border-radius:8px;padding:8px 10px;color:var(--t);outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--a2)}
select option{background:#1b2150}
input[type=range]{padding:0;accent-color:var(--a)}
textarea{min-height:70px;resize:vertical}
.statbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 14px;background:var(--p);border:1px solid var(--b);border-radius:14px}
.chip{background:rgba(0,0,0,.3);padding:6px 12px;border-radius:20px;font-size:14px}
.chip b{color:var(--a)}
.xpbar{flex:1;min-width:120px;height:10px;background:rgba(0,0,0,.4);border-radius:6px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#4fc3f7,#ffca28)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tab{background:var(--p);border:1px solid var(--b);color:var(--t);padding:10px 16px;border-radius:12px;cursor:pointer;font-weight:600}
.tab.on{background:linear-gradient(135deg,#5c6bff,#8e44ff);border-color:transparent}
.modgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.modbtn{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:10px;color:var(--t);cursor:pointer;text-align:center;display:flex;flex-direction:column;gap:2px}
.modbtn span{font-size:26px}
.modbtn b{font-size:13px}
.modbtn.on{border-color:var(--a);box-shadow:0 0 0 2px rgba(255,202,40,.4);background:rgba(255,202,40,.12)}
.stage{position:relative;height:480px;border-radius:14px;overflow:hidden;border:1px solid var(--b);background:#050816}
.stage:fullscreen{height:100vh;border-radius:0}
#labCanvas{position:absolute;inset:0}
#labCanvas canvas{display:block;width:100%;height:100%;touch-action:none}
.stage-live{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.6);padding:6px 12px;border-radius:8px;font-size:13px;max-width:62%;pointer-events:none}
.stage-toolbar{position:absolute;right:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stage-controls{position:absolute;left:10px;right:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:rgba(0,0,0,.6);padding:8px 12px;border-radius:10px}
.sl{min-width:210px;flex:1;color:var(--t)}
.sl b{color:var(--a)}
.q{font-size:17px;font-weight:600}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{background:rgba(0,0,0,.3);border:1px solid var(--b);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;color:var(--t)}
.opt:hover:not(:disabled){border-color:var(--a2)}
.opt.sel{border-color:var(--a);background:rgba(255,202,40,.15)}
.opt.right{background:rgba(102,187,106,.3);border-color:var(--ok)}
.opt.wrong{background:rgba(239,83,80,.3);border-color:var(--bad)}
.opt b{display:inline-block;width:24px;color:var(--a)}
.fb{font-weight:700;font-size:16px}
.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--b);vertical-align:middle}
th{color:var(--m);font-weight:600;white-space:nowrap}
td.pw{cursor:pointer;color:var(--a);font-family:Consolas,monospace}
td.pw:hover{text-decoration:underline}
.badge{display:inline-flex;align-items:center;gap:4px;background:rgba(0,0,0,.35);border:1px solid var(--b);padding:4px 10px;border-radius:20px;font-size:13px;margin:3px}
.badge.off{opacity:.35;filter:grayscale(1)}
.examhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
#examTimer{font-size:26px;font-weight:800;font-family:Consolas,monospace;color:var(--a)}
#examTimer.low{color:var(--bad);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.dot{width:32px;height:32px;border-radius:8px;border:1px solid var(--b);background:rgba(0,0,0,.3);color:var(--t);cursor:pointer;font-weight:700}
.dot.ans{background:rgba(79,195,247,.3)}
.dot.cur{border-color:var(--a);box-shadow:0 0 0 2px rgba(255,202,40,.5)}
.score{font-size:54px;font-weight:800;color:var(--a)}
.bar{height:12px;background:rgba(0,0,0,.4);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#43a047,#ffca28)}
.thread{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:8px;background:rgba(0,0,0,.25);border-radius:10px;margin-bottom:8px}
.msg{max-width:78%;padding:7px 12px;border-radius:12px;background:rgba(255,255,255,.12);align-self:flex-start}
.msg.me{align-self:flex-end;background:rgba(92,107,255,.55)}
.msg small{display:block;font-size:11px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--b)}
.rank{font-size:20px;width:34px;text-align:center}
.login{max-width:980px;margin:30px auto}
.login h1{font-size:34px;text-align:center}
.login h1 b{color:var(--a)}
.counters{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.counter{background:var(--p);border:1px solid var(--b);border-radius:14px;padding:12px 22px;text-align:center}
.counter b{display:block;font-size:28px;color:var(--a2)}
.pwwrap{position:relative}
.pwwrap button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;font-size:18px}
.democards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.demo{background:var(--p);border:1px solid var(--b);border-radius:14px;padding:16px;text-align:center;cursor:pointer;color:var(--t);transition:.15s}
.demo:hover{transform:translateY(-3px);border-color:var(--a)}
.demo span{font-size:38px;display:block}
.demo small{display:block;margin-top:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:2000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:#151a45;border:1px solid var(--b);border-radius:16px;padding:20px;max-width:760px;width:100%;max-height:92vh;overflow:auto}
.cert{background:#fffdf3;color:#3e2723;border:10px double #c9a227;border-radius:6px;padding:26px;text-align:center;font-family:Georgia,'Times New Roman',serif}
.cert h1{color:#8d6e00;font-size:26px;margin:6px 0}
.cert h2{font-size:34px;margin:10px 0;color:#1a237e}
.cert .sig{display:flex;justify-content:space-around;margin-top:26px;font-size:14px}
.cert .sig div{border-top:1px solid #3e2723;padding-top:4px;min-width:160px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:3000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:#1b2150;border:1px solid var(--a);padding:10px 18px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.5);animation:pop .25s}
@keyframes pop{from{transform:translateY(14px);opacity:0}}
/* ---- Ders videosu katmanı & Profesyonel Sinema Modu ---- */
.lsn{position:absolute;inset:0;z-index:20;pointer-events:none;overflow:hidden}
.lsn>*{pointer-events:auto}
.stage.lessonOn .stage-controls, .stage.lessonOn .stage-live{display:none}
.stage.lessonOn{border-color:#ffca28;box-shadow:0 0 30px rgba(255,202,40,0.2)}
.poster{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;text-align:center;padding:20px;background:radial-gradient(circle at 50% 35%,rgba(30,42,120,.72),rgba(4,7,20,.94));backdrop-filter:blur(3px)}
.poster h2{margin:0;font-size:28px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.poster .big{font-size:68px;animation:floaty 2.4s ease-in-out infinite}
.poster .play{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,#ffca28,#ff5722);display:flex;align-items:center;justify-content:center;font-size:44px;color:#fff;padding-left:8px;box-shadow:0 8px 25px rgba(255,87,34,.5);animation:pulse 1.8s infinite}
.poster:hover .play{filter:brightness(1.15);transform:scale(1.08)}
@keyframes floaty{50%{transform:translateY(-10px) rotate(4deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,202,40,.7)}70%{box-shadow:0 0 0 28px rgba(255,202,40,0)}100%{box-shadow:0 0 0 0 rgba(255,202,40,0)}}

/* Üst Sinematik Çubuk */
.lsn-top{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;align-items:center;background:rgba(8,12,32,0.88);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.14);border-radius:12px;padding:8px 14px;box-shadow:0 6px 20px rgba(0,0,0,0.5);z-index:25}
.lsn-top-info{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lsn-badge{background:linear-gradient(135deg,#ffca28,#ff7043);color:#0a0e27;font-weight:800;font-size:11px;padding:3px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:0.5px}
.lsn-title{font-size:14px;font-weight:700;color:#fff}
.lsn-chapter{font-size:13px;color:#90caf9}
.lsn-actions{display:flex;align-items:center;gap:6px}

/* İnfografik / Resim Kartı (PIP Window) */
.lsn-slide-card{position:absolute;right:14px;top:66px;width:290px;background:rgba(10,16,42,0.94);backdrop-filter:blur(10px);border:1.5px solid rgba(255,202,40,0.55);border-radius:14px;padding:10px;box-shadow:0 12px 30px rgba(0,0,0,0.7);display:none;flex-direction:column;gap:8px;z-index:24;animation:slideCardIn .35s ease-out}
.lsn-slide-card.show{display:flex}
@keyframes slideCardIn{from{opacity:0;transform:translateX(20px) scale(0.95)}to{opacity:1;transform:translateX(0) scale(1)}}
.lsn-slide-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.12);padding-bottom:6px}
.lsn-slide-head b{font-size:12px;color:#ffd54f;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.lsn-slide-imgbox{position:relative;width:100%;height:160px;background:#050818;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid rgba(255,255,255,0.1)}
.lsn-slide-imgbox img{width:100%;height:100%;object-fit:contain;transition:transform .25s ease}
.lsn-slide-imgbox:hover img{transform:scale(1.04)}
.lsn-slide-hint{position:absolute;bottom:4px;right:6px;background:rgba(0,0,0,0.75);color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;pointer-events:none}

/* Lightbox Modal for Fullscreen Slide */
#slideModal{position:fixed;inset:0;background:rgba(4,7,20,0.92);backdrop-filter:blur(10px);z-index:4000;display:none;align-items:center;justify-content:center;padding:20px}
#slideModal.show{display:flex}
#slideModal .modal-inner{max-width:880px;width:100%;background:#0c1432;border:2px solid #ffca28;border-radius:18px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,0.85);position:relative}
#slideModal .modal-head{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:rgba(0,0,0,0.4);border-bottom:1px solid rgba(255,255,255,0.1)}
#slideModal .modal-head h3{margin:0;font-size:16px;color:#ffd54f}
#slideModal .modal-body{padding:16px;max-height:76vh;overflow:auto;display:flex;align-items:center;justify-content:center;background:#070b1e}
#slideModal .modal-body img{max-width:100%;max-height:70vh;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,0.5)}

/* Alt Sinematik İskele (Dock) - Audio-First, Altyazısız Temiz Görünüm */
.dock{position:absolute;left:14px;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:25;pointer-events:auto}
.lsn-timeline{height:5px;background:rgba(255,255,255,0.2);border-radius:4px;overflow:hidden;position:relative}
.lsn-timeline-bar{height:100%;width:0;background:linear-gradient(90deg,#00e5ff,#ffca28,#ff5722);border-radius:4px;transition:width .4s}

/* Bilge Baykuş Ses & Bölüm Rozeti */
.lsn-speaker-pill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.08);padding:4px 10px;border-radius:20px;border:1px solid rgba(255,255,255,0.16)}
.owl{font-size:24px;line-height:1;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5));display:inline-block}
.owl.talk{animation:talk .45s ease-in-out infinite}
.sound-bars{display:flex;gap:3px;align-items:flex-end;height:16px;width:18px}
.sound-bar{width:3px;height:30%;background:#ffca28;border-radius:2px}
.owl.talk ~ .sound-bars .sound-bar{animation:soundWave .55s ease-in-out infinite alternate}
.sound-bar:nth-child(2){animation-delay:.15s;height:60%}
.sound-bar:nth-child(3){animation-delay:.3s;height:85%}
.sound-bar:nth-child(4){animation-delay:.45s;height:45%}
@keyframes soundWave{from{height:20%}to{height:100%}}

.lsn-now-playing{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden}
.lsn-step-badge{font-size:11px;font-weight:700;color:#ffd54f;background:rgba(255,213,79,0.16);border:1px solid rgba(255,213,79,0.4);padding:3px 8px;border-radius:8px;white-space:nowrap}
.lsn-step-title{font-size:14px;font-weight:700;color:#f8fafc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px}

/* Konuşma altyazı balonu kaldırıldı: ders anlatımı yalnızca ses odaklıdır, 3D sahneyi örtmez */
.bubble{display:none!important}

/* Alt Oynatıcı Kontrolleri */
.lctrl-bar{display:flex;align-items:center;justify-content:space-between;background:rgba(8,12,32,0.92);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.14);border-radius:12px;padding:6px 14px;box-shadow:0 8px 24px rgba(0,0,0,0.5)}
.lctrl-left{display:flex;align-items:center;gap:10px;min-width:0}
.lctrl-right{display:flex;align-items:center;gap:6px;flex-shrink:0}

.titlecard{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;background:rgba(10,15,50,.88);border:2px solid var(--a);border-radius:20px;padding:18px 36px;pointer-events:none!important;animation:tc 3s forwards;box-shadow:0 12px 35px rgba(0,0,0,.6)}
.titlecard span{font-size:62px;display:block}
.titlecard b{font-size:25px;color:var(--a)}
@keyframes tc{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.1);visibility:hidden}}
.emopop{position:absolute;left:50%;top:38%;font-size:84px;pointer-events:none!important;animation:emo 1.4s ease-out forwards}
@keyframes emo{0%{transform:translate(-50%,10px) scale(.2);opacity:0}25%{transform:translate(-50%,-10px) scale(1.2);opacity:1}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
.quiz{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;padding:14px 16px;overflow:auto;background:rgba(6,10,32,.93);backdrop-filter:blur(4px)}
.qtop{display:flex;justify-content:space-between;align-items:center;font-size:17px}
.qdots{display:flex;gap:6px}
.qd{width:34px;height:8px;border-radius:5px;background:rgba(255,255,255,.2)}
.qd.cur{background:var(--a)}.qd.ok{background:var(--ok)}.qd.no{background:var(--bad)}
.qtext{font-size:21px;font-weight:700;line-height:1.35}
.opts2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts2 .opt{font-size:16px}
.opts2 .opt:disabled{cursor:default}
.fbk{font-size:19px;font-weight:800;min-height:28px}
.quiz.sum{align-items:center;justify-content:center;text-align:center}
.quiz.sum h2{font-size:32px;margin:0}
.bigemo{font-size:72px;animation:floaty 2.2s ease-in-out infinite}
.stars{font-size:38px;letter-spacing:6px}
@media(max-width:768px){.opts2{grid-template-columns:1fr}.qtext{font-size:18px}.lsn-slide-card{width:220px;top:58px}.lsn-slide-imgbox{height:115px}.lsn-step-title{max-width:160px;font-size:12px}.lsn-speaker-pill{padding:3px 6px}.owl{font-size:20px}}
#printArea{display:none}
.adbox{border:2px dashed var(--a);border-radius:10px;padding:10px;text-align:center;color:var(--a);margin:6px 0}
.adbox.no{border-color:var(--bad);color:var(--bad)}
@media(max-width:700px){.stage{height:420px}.stage-live{max-width:90%;top:46px}}
@media print{
  body.printing>*:not(#printArea){display:none!important}
  body.printing{background:#fff!important;color:#000!important;padding:0!important}
  body.printing #printArea{display:block!important;color:#000;padding:10px}
  #printArea table{font-size:13px}
  #printArea th,#printArea td{border:1px solid #444;color:#000;padding:6px}

}

/* ================= 4. SINIF DERSLER & VİDEO MÜFREDATI ================= */
.courses-wrap{display:flex;flex-direction:column;gap:16px}
.courses-hero{background:linear-gradient(135deg,rgba(99,102,241,0.2) 0%,rgba(236,72,153,0.15) 50%,rgba(15,23,42,0.7) 100%);border:1px solid rgba(255,255,255,0.12);border-radius:18px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.courses-hero-text h2{margin:0 0 4px 0;font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px;color:var(--t)}
.courses-hero-text p{margin:0;font-size:13px;color:var(--m)}
.courses-sub-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
@media(max-width:960px){.courses-sub-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:540px){.courses-sub-grid{grid-template-columns:repeat(2,1fr)}}
.course-card-btn{background:var(--p);border:2px solid var(--b);border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:all .22s cubic-bezier(0.4,0,0.2,1);text-align:center;color:var(--t);position:relative;overflow:hidden;user-select:none}
.course-card-btn:hover{transform:translateY(-2px);border-color:rgba(255,255,255,0.3);box-shadow:0 6px 18px rgba(0,0,0,0.35)}
.course-card-btn.active{border-color:var(--theme-color,#6366f1);background:linear-gradient(135deg,rgba(255,255,255,0.09),rgba(255,255,255,0.02));box-shadow:0 0 0 3px rgba(99,102,241,0.25),0 8px 24px rgba(0,0,0,0.4);transform:translateY(-2px)}
.course-card-btn .course-icon{font-size:28px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4))}
.course-card-btn .course-name{font-size:13px;font-weight:800}
.course-card-btn .course-badge{font-size:10px;opacity:.75;font-weight:600}

.courses-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 14px;background:rgba(0,0,0,0.25);border-radius:12px;border:1px solid var(--b)}
.term-filter-tabs{display:flex;gap:6px;flex-wrap:wrap}
.term-tab-btn{background:var(--p);border:1px solid var(--b);border-radius:10px;padding:6px 12px;color:var(--t);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s}
.term-tab-btn:hover{background:rgba(255,255,255,0.06)}
.term-tab-btn.active{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border-color:transparent;box-shadow:0 2px 10px rgba(99,102,241,0.4)}
.courses-search{background:rgba(0,0,0,0.35);border:1px solid var(--b);border-radius:10px;padding:6px 12px;color:var(--t);font-size:13px;min-width:210px;outline:none}
.courses-search:focus{border-color:var(--a)}

.term-section{margin-bottom:20px}
.term-section-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--b);color:var(--t)}
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
@media(max-width:600px){.video-grid{grid-template-columns:1fr}}

.video-card{background:var(--p);border:1px solid var(--b);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:all .22s ease;cursor:pointer;position:relative}
.video-card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,0.25);box-shadow:0 10px 28px rgba(0,0,0,0.45)}
.video-thumb{position:relative;width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,#1e1b4b 0%,#311042 100%);display:flex;align-items:center;justify-content:center;overflow:hidden}
.video-thumb-bg{position:absolute;inset:0;opacity:.18;display:flex;align-items:center;justify-content:center;font-size:80px;user-select:none}
.video-badge-unit{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,0.15);padding:3px 8px;border-radius:8px;font-size:11px;font-weight:800;color:#fff;letter-spacing:.3px}
.video-badge-ready{position:absolute;top:10px;right:10px;background:rgba(245,158,11,0.25);border:1px solid rgba(245,158,11,0.5);color:#fbbf24;padding:3px 8px;border-radius:8px;font-size:10px;font-weight:800;backdrop-filter:blur(4px)}
.video-badge-duration{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,0.75);padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700;color:#fff}
.play-btn-circle{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#ef4444,#f97316);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;box-shadow:0 4px 18px rgba(239,68,68,0.5);transition:all .2s cubic-bezier(0.34,1.56,0.64,1);z-index:2}
.video-card:hover .play-btn-circle{transform:scale(1.15);box-shadow:0 6px 24px rgba(239,68,68,0.75)}
.video-card-body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.video-unit-title{font-size:14px;font-weight:800;color:var(--t);line-height:1.35;margin:0}
.video-topics-pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.video-topic-pill{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);font-size:11px;padding:2px 7px;border-radius:6px;color:var(--m);white-space:nowrap}
.video-card-footer{margin-top:auto;padding-top:8px;border-top:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--m)}
.video-card-btn-action{color:var(--a);font-weight:800;display:flex;align-items:center;gap:4px}
.course-mini-progress{width:100%;height:3px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;margin-top:4px}
.course-mini-progress i{display:block;height:100%;border-radius:2px;transition:width .3s}
.home-alert-banner{background:linear-gradient(135deg,rgba(245,158,11,0.2) 0%,rgba(217,119,6,0.1) 100%);border:1px solid rgba(245,158,11,0.5);border-radius:14px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;animation:pulseBorder 2.5s infinite}
@keyframes pulseBorder{0%,100%{border-color:rgba(245,158,11,0.45)}50%{border-color:rgba(245,158,11,0.9);box-shadow:0 0 14px rgba(245,158,11,0.25)}}
.resume-card{background:linear-gradient(135deg,rgba(99,102,241,0.18) 0%,rgba(16,185,129,0.15) 100%);border:1px solid rgba(99,102,241,0.35);border-radius:14px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;box-shadow:0 4px 16px rgba(0,0,0,0.2)}
.daily-tip-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--t)}
.status-filter-tabs{display:flex;gap:6px;flex-wrap:wrap}

.video-modal-screen{position:relative;width:100%;aspect-ratio:16/9;background:radial-gradient(circle at center,#1e1b4b 0%,#09090f 100%);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,0.15);box-shadow:0 10px 30px rgba(0,0,0,0.5);text-align:center;padding:20px}
.video-modal-play-pulse{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#ef4444,#f97316);display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;margin-bottom:12px;box-shadow:0 0 0 0 rgba(239,68,68,0.7);animation:pulse-ring 1.8s infinite}
@keyframes pulse-ring{0%{box-shadow:0 0 0 0 rgba(239,68,68,0.6)}70%{box-shadow:0 0 0 18px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}

/* ================= DERS VİDEO VE TEST OYNATICI (COURSE PLAYER) ================= */
.modal-box.theater{max-width:980px;padding:16px}
.cp-wrap{display:flex;flex-direction:column;gap:12px;width:100%}
.cp-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--b);flex-wrap:wrap}
.cp-header-title{display:flex;align-items:center;gap:10px}
.cp-header-title h3{margin:0;font-size:17px;font-weight:800;color:var(--t)}
.cp-header-title small{color:var(--m);font-size:12px}
.cp-stage{position:relative;width:100%;aspect-ratio:16/9;background:#090d16;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,0.12);box-shadow:0 8px 30px rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center}
@media(max-width:640px){.cp-stage{aspect-ratio:4/3}}
.cp-slide-img{width:100%;height:100%;object-fit:contain;background:#090d16;user-select:none}
.cp-step-badge{position:absolute;top:12px;left:12px;background:rgba(0,0,0,0.75);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.2);padding:4px 10px;border-radius:8px;font-size:11px;font-weight:800;color:#fff;z-index:10}
.cp-speaker-badge{position:absolute;top:12px;right:12px;background:rgba(99,102,241,0.25);border:1px solid rgba(99,102,241,0.5);backdrop-filter:blur(6px);padding:4px 10px;border-radius:8px;font-size:11px;font-weight:800;color:#c7d2fe;display:flex;align-items:center;gap:6px;z-index:10}
.cp-speaker-badge .owl-icon{font-size:15px;display:inline-block;transition:transform .2s}
.cp-speaker-badge.talking .owl-icon{animation:talkPulse 0.4s infinite alternate}
@keyframes talkPulse{from{transform:scale(1)}to{transform:scale(1.35) rotate(-5deg)}}

.cp-controls{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:rgba(0,0,0,0.3);border-radius:12px;border:1px solid var(--b);flex-wrap:wrap}
.cp-timeline{width:100%;height:6px;background:rgba(255,255,255,0.1);border-radius:4px;overflow:hidden;cursor:pointer;position:relative}
.cp-timeline-fill{height:100%;background:linear-gradient(90deg,#ef4444,#f59e0b);transition:width 0.3s ease}
.cp-ctrl-btns{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

.cp-quiz-box{display:flex;flex-direction:column;gap:14px;padding:4px 0}
.cp-quiz-top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(255,255,255,0.03);border:1px solid var(--b);border-radius:12px}
.cp-qdots{display:flex;gap:5px;flex-wrap:wrap}
.cp-qdot{width:22px;height:7px;border-radius:4px;background:rgba(255,255,255,0.15);transition:all .2s}
.cp-qdot.cur{background:var(--a);box-shadow:0 0 8px var(--a)}
.cp-qdot.ok{background:var(--ok)}
.cp-qdot.no{background:var(--bad)}
.cp-qtext{font-size:17px;font-weight:700;line-height:1.45;color:var(--t);margin:6px 0}
.cp-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.cp-opts{grid-template-columns:1fr}}
.cp-opt{padding:12px 14px;border-radius:12px;background:var(--p);border:1px solid var(--b);color:var(--t);font-size:14px;font-weight:700;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;transition:all .18s;outline:none}
.cp-opt:hover:not(:disabled){border-color:var(--a);background:rgba(255,255,255,0.06);transform:translateY(-1px)}
.cp-opt.ok{border-color:var(--ok)!important;background:rgba(34,197,94,0.2)!important;color:#86efac!important}
.cp-opt.no{border-color:var(--bad)!important;background:rgba(239,68,68,0.2)!important;color:#fca5a5!important}
.cp-fbk{padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.4;margin-top:6px}
.cp-fbk.ok{background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.3);color:#bbf7d0}
.cp-fbk.no{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#fecaca}

.cp-summary{text-align:center;padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px}
.cp-summary h2{margin:0;font-size:26px;font-weight:900}
.cp-summary-score{font-size:42px;font-weight:900;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
</style>

<body>
<div id="impBar" class="impbar hidden"></div>
<div id="app"></div>
<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<div id="printArea"></div>
<div id="toast"></div><script>
'use strict';
const SERVER_JS = "// Bilgi Evreni 4D Ultimate - Ev Sunucusu (bagimliliksiz Node.js)\n// Calistirma: node server.js   (veya baslat.bat)\nconst http = require('http');\nconst fs = require('fs');\nconst path = require('path');\nconst os = require('os');\nconst crypto = require('crypto');\nconst { spawn, execFile } = require('child_process');\n\nconst PORT = process.env.PORT || 3000;\nconst DIR = __dirname;\nconst DB_FILE = path.join(DIR, 'veritabani.json');\nconst INDEX_FILE = path.join(DIR, 'index.html');\nconst MAX_BODY = 8 * 1024 * 1024;\n\n// ---------- Dogal ses (Microsoft Emel Neural, Python edge-tts) ----------\nconst PY_SCRIPT = path.join(DIR, 'ses_motoru.py');\nconst TTS_DIR = path.join(DIR, 'ses_onbellek');\nconst TTS_VERSION = 'v1';\nconst TTS_MAX_TEXT = 4000;\nconst TTS_MAX_PARALLEL = 3;\nconst TTS_LANGS = ['tr-TR', 'en-US'];\nconst TTS_STYLES = ['ders', 'coskulu', 'sakin'];\nconst tts = { ready: false, python: null, ffmpeg: false, error: 'Henuz kontrol edilmedi', checkedAt: 0 };\nlet ttsActive = 0;\nconst ttsWaiting = [];\nconst ttsInflight = new Map();\n\nfunction tryRun(cmd, args) {\n  return new Promise((resolve) => {\n    execFile(cmd, args, { windowsHide: true, timeout: 20000 }, (err) => resolve(!err));\n  });\n}\n\nasync function detectTts() {\n  tts.checkedAt = Date.now();\n  if (!fs.existsSync(PY_SCRIPT)) { tts.ready = false; tts.error = 'ses_motoru.py bulunamadi'; return; }\n  const candidates = [process.env.PYTHON, 'python', 'py', 'python3'].filter(Boolean);\n  let found = null;\n  for (const c of candidates) {\n    if (await tryRun(c, ['-c', 'import edge_tts'])) { found = c; break; }\n  }\n  tts.ffmpeg = await tryRun('ffmpeg', ['-version']);\n  if (found) {\n    tts.ready = true; tts.python = found; tts.error = '';\n  } else {\n    tts.ready = false; tts.python = null;\n    tts.error = 'Python veya edge-tts kurulu degil (pip install edge-tts)';\n  }\n}\n\nfunction pruneTtsCache(max) {\n  try {\n    const files = fs.readdirSync(TTS_DIR).filter((f) => f.endsWith('.mp3')).map((f) => {\n      const p = path.join(TTS_DIR, f);\n      return { p, t: fs.statSync(p).mtimeMs };\n    }).sort((a, b) => a.t - b.t);\n    files.slice(0, Math.max(0, files.length - max)).forEach((f) => { try { fs.unlinkSync(f.p); } catch (e) {} });\n  } catch (e) {}\n}\n\nfunction ttsRunSlot(job) {\n  if (ttsActive < TTS_MAX_PARALLEL) { ttsActive++; job(); } else { ttsWaiting.push(job); }\n}\nfunction ttsRelease() {\n  ttsActive--;\n  const next = ttsWaiting.shift();\n  if (next) { ttsActive++; next(); }\n}\n\nfunction ttsGenerate(text, lang, style) {\n  const key = crypto.createHash('sha1').update([TTS_VERSION, lang, style, text].join('|')).digest('hex');\n  const out = path.join(TTS_DIR, key + '.mp3');\n  if (fs.existsSync(out)) return Promise.resolve(out);\n  if (ttsInflight.has(key)) return ttsInflight.get(key);\n  const p = new Promise((resolve, reject) => {\n    ttsRunSlot(() => {\n      fs.mkdirSync(TTS_DIR, { recursive: true });\n      const txt = path.join(TTS_DIR, key + '.txt');\n      const tmpOut = path.join(TTS_DIR, key + '.tmp.mp3');\n      fs.writeFileSync(txt, text, 'utf8');\n      const args = ['-X', 'utf8', PY_SCRIPT, '--text-file', txt, '--out', tmpOut, '--lang', lang, '--style', style];\n      const child = spawn(tts.python, args, { windowsHide: true });\n      let err = '';\n      child.stderr.on('data', (d) => { err += d.toString(); });\n      const timer = setTimeout(() => { try { child.kill(); } catch (e) {} }, 90000);\n      const finish = (e) => {\n        clearTimeout(timer);\n        try { fs.unlinkSync(txt); } catch (x) {}\n        ttsRelease();\n        if (e) { try { fs.unlinkSync(tmpOut); } catch (x) {} return reject(e); }\n        try { fs.renameSync(tmpOut, out); resolve(out); } catch (x) { reject(x); }\n      };\n      child.on('error', (e) => finish(e));\n      child.on('close', (code) => {\n        if (code === 0 && fs.existsSync(tmpOut)) finish(null);\n        else finish(new Error('ses_motoru.py hata kodu ' + code + ': ' + err.trim().slice(-300)));\n      });\n    });\n  });\n  ttsInflight.set(key, p);\n  const clear = () => ttsInflight.delete(key);\n  p.then(clear, clear);\n  return p;\n}\n\nfunction readDb() {\n  try {\n    if (!fs.existsSync(DB_FILE)) return null;\n    return JSON.parse(fs.readFileSync(DB_FILE, 'utf8'));\n  } catch (e) {\n    console.error('Veritabani okunamadi:', e.message);\n    return null;\n  }\n}\n\nfunction writeDb(obj) {\n  const tmp = DB_FILE + '.tmp';\n  fs.writeFileSync(tmp, JSON.stringify(obj, null, 2), 'utf8');\n  fs.renameSync(tmp, DB_FILE);\n}\n\nfunction send(res, code, body, type) {\n  res.writeHead(code, {\n    'Content-Type': type || 'application/json; charset=utf-8',\n    'Cache-Control': 'no-store'\n  });\n  res.end(typeof body === 'string' || Buffer.isBuffer(body) ? body : JSON.stringify(body));\n}\n\nconst server = http.createServer((req, res) => {\n  const url = req.url.split('?')[0];\n\n  if (req.method === 'GET' && (url === '/' || url === '/index.html')) {\n    if (!fs.existsSync(INDEX_FILE)) return send(res, 404, 'index.html bulunamadi. server.js ile ayni klasore koyun.', 'text/plain; charset=utf-8');\n    return send(res, 200, fs.readFileSync(INDEX_FILE), 'text/html; charset=utf-8');\n  }\n\n  if (req.method === 'GET' && url === '/api/ping') {\n    const db = readDb();\n    return send(res, 200, { ok: true, hasDb: !!db, updatedAt: db ? db.updatedAt || 0 : 0, time: Date.now() });\n  }\n\n  if (req.method === 'GET' && url === '/api/db') {\n    const db = readDb();\n    return send(res, 200, { ok: true, db: db });\n  }\n\n  if (req.method === 'GET' && url === '/api/tts/status') {\n    return send(res, 200, { ok: true, ready: tts.ready, ffmpeg: tts.ffmpeg, voice: 'tr-TR-EmelNeural', error: tts.error });\n  }\n\n  if (req.method === 'POST' && url === '/api/tts') {\n    let size = 0;\n    const chunks = [];\n    req.on('data', (c) => {\n      size += c.length;\n      if (size > 32 * 1024) { send(res, 413, { ok: false, error: 'Metin cok uzun' }); req.destroy(); return; }\n      chunks.push(c);\n    });\n    req.on('end', async () => {\n      if (size > 32 * 1024) return;\n      let body;\n      try { body = JSON.parse(Buffer.concat(chunks).toString('utf8')); } catch (e) { return send(res, 400, { ok: false, error: 'JSON okunamadi' }); }\n      const text = String(body && body.text || '').trim();\n      const lang = TTS_LANGS.includes(body.lang) ? body.lang : 'tr-TR';\n      const style = TTS_STYLES.includes(body.style) ? body.style : 'ders';\n      if (!text || text.length > TTS_MAX_TEXT) return send(res, 400, { ok: false, error: 'Metin bos veya cok uzun' });\n      if (!tts.ready && Date.now() - tts.checkedAt > 30000) await detectTts();\n      if (!tts.ready) return send(res, 503, { ok: false, error: tts.error });\n      try {\n        const file = await ttsGenerate(text, lang, style);\n        const stat = fs.statSync(file);\n        res.writeHead(200, { 'Content-Type': 'audio/mpeg', 'Content-Length': stat.size, 'Cache-Control': 'public, max-age=86400' });\n        fs.createReadStream(file).pipe(res);\n      } catch (e) {\n        console.error('TTS hatasi:', e.message);\n        send(res, 500, { ok: false, error: 'Ses uretilemedi' });\n      }\n    });\n    return;\n  }\n\n  if (req.method === 'GET' && url === '/api/backup') {\n    const db = readDb() || {};\n    res.writeHead(200, {\n      'Content-Type': 'application/json; charset=utf-8',\n      'Content-Disposition': 'attachment; filename=\"veritabani-yedek.json\"'\n    });\n    return res.end(JSON.stringify(db, null, 2));\n  }\n\n  if (req.method === 'POST' && url === '/api/db') {\n    let size = 0;\n    const chunks = [];\n    req.on('data', (c) => {\n      size += c.length;\n      if (size > MAX_BODY) {\n        send(res, 413, { ok: false, error: 'Veri cok buyuk' });\n        req.destroy();\n        return;\n      }\n      chunks.push(c);\n    });\n    req.on('end', () => {\n      if (size > MAX_BODY) return;\n      try {\n        const incoming = JSON.parse(Buffer.concat(chunks).toString('utf8'));\n        if (!incoming || !Array.isArray(incoming.users)) {\n          return send(res, 400, { ok: false, error: 'Gecersiz veritabani bicimi' });\n        }\n        const current = readDb();\n        const force = req.headers['x-force'] === '1';\n        if (current && !force && (current.updatedAt || 0) > (incoming.updatedAt || 0)) {\n          return send(res, 409, { ok: false, error: 'Sunucudaki veri daha yeni', db: current });\n        }\n        writeDb(incoming);\n        return send(res, 200, { ok: true, updatedAt: incoming.updatedAt || 0 });\n      } catch (e) {\n        return send(res, 400, { ok: false, error: 'JSON okunamadi' });\n      }\n    });\n    return;\n  }\n\n  send(res, 404, { ok: false, error: 'Bulunamadi' });\n});\n\nserver.listen(PORT, '0.0.0.0', () => {\n  console.log('==============================================');\n  console.log(' BILGI EVRENI 4D ULTIMATE - Sunucu calisiyor');\n  console.log('==============================================');\n  console.log(' Bu bilgisayardan : http://localhost:' + PORT);\n  const nets = os.networkInterfaces();\n  Object.keys(nets).forEach((name) => {\n    nets[name].forEach((n) => {\n      if (n.family === 'IPv4' && !n.internal) {\n        console.log(' Ayni agdaki cihaz : http://' + n.address + ':' + PORT + '  (' + name + ')');\n      }\n    });\n  });\n  console.log(' Veritabani        : ' + DB_FILE);\n  pruneTtsCache(600);\n  detectTts().then(() => {\n    if (tts.ready) console.log(' Dogal ses (Emel)  : HAZIR (' + tts.python + (tts.ffmpeg ? ', ffmpeg var: nefes+duraklama acik' : ', ffmpeg YOK: nefes/duraklama eklenmez') + ')');\n    else console.log(' Dogal ses (Emel)  : KAPALI - ' + tts.error + ' (tarayici sesi kullanilir)');\n  });\n  console.log(' Durdurmak icin bu pencereyi kapatin.');\n});";

const PY_FILE = "# -*- coding: utf-8 -*-\n\"\"\"\nBilgi Evreni 4D - Dogal Ses Motoru\n==================================\nMicrosoft Neural sesi (tr-TR-EmelNeural) + ffmpeg ile \"insan gibi\" seslendirme:\n  * Cumleler tek tek, duygusuna gore (neseli / heyecanli / merakli / sakin) okunur\n  * Cumleler arasina dogal duraklama ve hafif NEFES sesi eklenir\n  * Her cumlede ritim ve ton cok az degistirilir (robotik tekduzeligi kirar)\n\nKullanim:\n  python ses_motoru.py --text-file metin.txt --out ses.mp3 [--lang tr-TR] [--style ders|coskulu|sakin] [--nefes 1]\nGereksinim:\n  pip install edge-tts      (ffmpeg varsa nefes/duraklama eklenir, yoksa sade birlestirme yapilir)\n\"\"\"\nimport argparse\nimport asyncio\nimport hashlib\nimport os\nimport random\nimport re\nimport shutil\nimport subprocess\nimport sys\nimport tempfile\n\ntry:\n    import edge_tts\nexcept ImportError:\n    sys.stderr.write(\"edge-tts kurulu degil. Kurmak icin: pip install edge-tts\\n\")\n    sys.exit(2)\n\nVOICE_TR = \"tr-TR-EmelNeural\"\nVOICE_EN = \"en-US-JennyNeural\"\nVOICE_EN_WORD = \"en-US-AnaNeural\"   # tek kelimelerde sevimli cocuk tonu\n\n# rate: yuzde, pitch: Hz. (excl/ques/joy/first/last) = (rate_artisi, pitch_artisi)\nSTYLES = {\n    \"ders\": dict(rate=-3, pitch=2, vol=0, excl=(8, 6), ques=(-1, 9), joy=(6, 7),\n                 first=(2, 2), last=(-7, 2), pause=(0.34, 0.55), comma=0.16),\n    \"coskulu\": dict(rate=2, pitch=4, vol=3, excl=(12, 9), ques=(2, 12), joy=(10, 10),\n                    first=(4, 3), last=(-6, 3), pause=(0.28, 0.45), comma=0.13),\n    \"sakin\": dict(rate=-8, pitch=0, vol=0, excl=(3, 3), ques=(-3, 5), joy=(2, 3),\n                  first=(0, 1), last=(-8, 0), pause=(0.45, 0.7), comma=0.2),\n}\n\nJOY_RE = re.compile(\n    r\"^(merhaba|selam|harika|bravo|aferin|s[uü]per|hadi|haydi|tebrikler|\"\n    r\"muhte[sş]em|m[uü]kemmel|[cç]ok g[uü]zel|hoş geldin|ho[sş] geldin|g[oö]r[uü][sş]elim|\"\n    r\"hello|hi|great|wonderful|well done|let's|come on)\",\n    re.IGNORECASE,\n)\nEMOJI_RE = re.compile(\"[\\U0001F000-\\U0001FFFF\\u2600-\\u27BF\\u2B00-\\u2BFF\\uFE0F\\u200D]\")\n\n\ndef log(msg):\n    sys.stderr.write(str(msg) + \"\\n\")\n\n\ndef clamp(v, lo, hi):\n    return max(lo, min(hi, v))\n\n\ndef normalize_text(text, lang):\n    \"\"\"Sesli okuma icin metni temizler (emoji, sembol, kesir...).\"\"\"\n    t = EMOJI_RE.sub(\"\", text)\n    t = t.replace(\"\\r\", \"\\n\")\n    if lang.startswith(\"tr\"):\n        t = re.sub(r\"(\\d+)\\s*/\\s*(\\d+)\", r\"\\1 bölü \\2\", t)\n        t = t.replace(\"×\", \" çarpı \").replace(\"÷\", \" bölü \").replace(\"°\", \" derece \")\n        t = re.sub(r\"(?<=\\d)\\s*\\+\\s*(?=\\d)\", \" artı \", t)\n        t = re.sub(r\"(?<=\\d)\\s*=\\s*(?=\\d)\", \" eşittir \", t)\n        t = t.replace(\"4D\", \"dört de\").replace(\" TL\", \" Türk lirası\")\n    t = re.sub(r\"[ \\t]+\", \" \", t)\n    return t.strip()\n\n\ndef split_sentences(text):\n    \"\"\"[(cumle, durak_turu)] dondurur. durak_turu: 'sentence' | 'comma' | 'para'.\"\"\"\n    out = []\n    paragraphs = [p.strip() for p in re.split(r\"\\n\\s*\\n|\\n\", text) if p.strip()]\n    for pi, para in enumerate(paragraphs):\n        sents = [s.strip() for s in re.split(r\"(?<=[.!?…])\\s+\", para) if s.strip()]\n        for si, s in enumerate(sents):\n            parts = [s]\n            if len(s) > 120:  # uzun cumleyi virgul/noktali virgulden bol -> dogal nefes\n                chunks = [c.strip() for c in re.split(r\"(?<=[,;:])\\s+\", s) if c.strip()]\n                parts, cur = [], \"\"\n                for c in chunks:\n                    if cur and len(cur) + len(c) > 90:\n                        parts.append(cur)\n                        cur = c\n                    else:\n                        cur = (cur + \" \" + c).strip()\n                if cur:\n                    parts.append(cur)\n            for k, p in enumerate(parts):\n                last_part = k == len(parts) - 1\n                if not last_part:\n                    kind = \"comma\"\n                elif si == len(sents) - 1 and pi < len(paragraphs) - 1:\n                    kind = \"para\"\n                else:\n                    kind = \"sentence\"\n                out.append((p, kind))\n    if out:\n        out[-1] = (out[-1][0], \"end\")\n    return out\n\n\ndef emotion(sentence, idx, n, st, rng, kind_prev):\n    rate, pitch, vol = st[\"rate\"], st[\"pitch\"], st[\"vol\"]\n    t = sentence.strip()\n    if t.endswith(\"!\"):\n        rate += st[\"excl\"][0]; pitch += st[\"excl\"][1]; vol += 4\n    elif t.endswith(\"?\"):\n        rate += st[\"ques\"][0]; pitch += st[\"ques\"][1]\n    if JOY_RE.match(t):\n        rate += st[\"joy\"][0]; pitch += st[\"joy\"][1]; vol += 3\n    if n > 1 and idx == 0:\n        rate += st[\"first\"][0]; pitch += st[\"first\"][1]\n    if n > 1 and idx == n - 1:\n        rate += st[\"last\"][0]; pitch += st[\"last\"][1]\n    # cumleden cumleye kucuk, rastgele (ama tekrarlanabilir) degisim: monotonlugu kirar\n    rate += rng.randint(-2, 2)\n    pitch += rng.randint(-2, 2)\n    return clamp(rate, -30, 30), clamp(pitch, -20, 25), clamp(vol, -10, 15)\n\n\nasync def synth_one(text, voice, rate, pitch, vol, path, sem):\n    async with sem:\n        last_err = None\n        for attempt in range(4):\n            try:\n                comm = edge_tts.Communicate(\n                    text, voice,\n                    rate=\"%+d%%\" % rate, pitch=\"%+dHz\" % pitch, volume=\"%+d%%\" % vol,\n                )\n                await comm.save(path)\n                if os.path.exists(path) and os.path.getsize(path) > 200:\n                    return\n                last_err = RuntimeError(\"bos ses dosyasi\")\n            except Exception as e:  # ag hatasi vb. -> tekrar dene\n                last_err = e\n            await asyncio.sleep(0.8 * (attempt + 1))\n        raise last_err\n\n\ndef build_plan(text, lang, style_name):\n    st = STYLES.get(style_name, STYLES[\"ders\"])\n    seed = int(hashlib.sha1((text + style_name).encode(\"utf-8\")).hexdigest()[:8], 16)\n    rng = random.Random(seed)\n    is_tr = lang.lower().startswith(\"tr\")\n    clean = normalize_text(text, lang)\n    words = re.findall(r\"\\w+\", clean, re.UNICODE)\n\n    # Ingilizce tek kelime: once normal, sonra yavas tekrar (kelime ogretimi)\n    if not is_tr and len(words) == 1:\n        w = clean.strip(\" .!?\")\n        return [\n            dict(text=w + \"!\", voice=VOICE_EN_WORD, rate=0, pitch=6, vol=4, kind=\"word\"),\n            dict(text=w + \".\", voice=VOICE_EN_WORD, rate=-20, pitch=2, vol=0, kind=\"end\"),\n        ], st\n\n    voice = VOICE_TR if is_tr else VOICE_EN\n    sents = split_sentences(clean)\n    n = len(sents)\n    plan, prev = [], None\n    for i, (s, kind) in enumerate(sents):\n        r, p, v = emotion(s, i, n, st, rng, prev)\n        plan.append(dict(text=s, voice=voice, rate=r, pitch=p, vol=v, kind=kind))\n        prev = kind\n    return plan, st\n\n\ndef find_ffmpeg():\n    return shutil.which(\"ffmpeg\")\n\n\ndef stitch_ffmpeg(ffmpeg, plan, files, st, nefes, out_path, rng):\n    \"\"\"Cumleleri; duraklama + nefes sesiyle birlestirir, ses seviyesini dengeler.\"\"\"\n    inputs, filters, labels = [], [], []\n    idx = 0\n\n    def add_file(path):\n        nonlocal idx\n        inputs.extend([\"-i\", path])\n        # Microsoft sesi her parcanin basina/sonuna ~0.3-0.5 sn sessizlik koyar: kirpip ritmi biz belirleriz\n        trim = (\"silenceremove=start_periods=1:start_threshold=-48dB:start_silence=0.04,areverse,\"\n                \"silenceremove=start_periods=1:start_threshold=-48dB:start_silence=0.06,areverse\")\n        filters.append(\"[%d:a]aresample=24000,aformat=sample_fmts=fltp:channel_layouts=mono,%s[a%d]\" % (idx, trim, idx))\n        labels.append(\"[a%d]\" % idx)\n        idx += 1\n\n    def add_silence(sec):\n        nonlocal idx\n        inputs.extend([\"-f\", \"lavfi\", \"-t\", \"%.3f\" % sec, \"-i\", \"anullsrc=r=24000:cl=mono\"])\n        filters.append(\"[%d:a]aformat=sample_fmts=fltp:channel_layouts=mono[a%d]\" % (idx, idx))\n        labels.append(\"[a%d]\" % idx)\n        idx += 1\n\n    def add_breath(sec):\n        nonlocal idx\n        inputs.extend([\"-f\", \"lavfi\", \"-t\", \"%.3f\" % sec, \"-i\",\n                       \"anoisesrc=r=24000:c=pink:a=0.6:d=%.3f\" % sec])\n        fo = max(0.05, sec * 0.55)\n        filters.append(\n            \"[%d:a]highpass=f=260,lowpass=f=2400,afade=t=in:st=0:d=%.3f,afade=t=out:st=%.3f:d=%.3f,\"\n            \"volume=0.15,aformat=sample_fmts=fltp:channel_layouts=mono[a%d]\"\n            % (idx, sec * 0.45, sec - fo, fo, idx))\n        labels.append(\"[a%d]\" % idx)\n        idx += 1\n\n    add_silence(0.12)\n    speech_since_breath = 0.0\n    for i, (item, f) in enumerate(zip(plan, files)):\n        add_file(f)\n        speech_since_breath += len(item[\"text\"]) / 14.0   # yaklasik konusma suresi (sn)\n        kind = item[\"kind\"]\n        if kind == \"end\":\n            add_silence(0.25)\n            break\n        if kind == \"comma\":\n            add_silence(st[\"comma\"] + rng.uniform(0, 0.06))\n        elif kind == \"word\":\n            add_silence(0.7)\n        else:\n            base = rng.uniform(*st[\"pause\"])\n            if kind == \"para\":\n                base += 0.35\n            # yeterince uzun konusulduysa nefes al: 'hhh' + kisa sessizlik\n            if nefes and (speech_since_breath > 5.5 or kind == \"para\"):\n                add_silence(base * 0.45)\n                add_breath(rng.uniform(0.26, 0.38))\n                add_silence(0.05)\n                speech_since_breath = 0.0\n            else:\n                add_silence(base)\n\n    chain = \"\".join(labels) + \"concat=n=%d:v=0:a=1,loudnorm=I=-16:TP=-1.5:LRA=9[out]\" % len(labels)\n    filter_complex = \";\".join(filters + [chain])\n    cmd = [ffmpeg, \"-y\", \"-hide_banner\", \"-loglevel\", \"error\"] + inputs + [\n        \"-filter_complex\", filter_complex, \"-map\", \"[out]\",\n        \"-c:a\", \"libmp3lame\", \"-b:a\", \"64k\", \"-ar\", \"24000\", \"-ac\", \"1\", out_path]\n    r = subprocess.run(cmd, capture_output=True, text=True)\n    if r.returncode != 0:\n        raise RuntimeError(\"ffmpeg hatasi: \" + (r.stderr or \"\")[-400:])\n\n\ndef stitch_plain(files, out_path):\n    \"\"\"ffmpeg yoksa: mp3 parcalarini ardarda ekle (nefes/duraklama olmaz).\"\"\"\n    with open(out_path, \"wb\") as o:\n        for f in files:\n            with open(f, \"rb\") as i:\n                o.write(i.read())\n\n\nasync def main_async(args):\n    with open(args.text_file, \"r\", encoding=\"utf-8\") as fh:\n        text = fh.read()\n    if not text.strip():\n        raise SystemExit(\"Bos metin.\")\n    plan, st = build_plan(text, args.lang, args.style)\n    if not plan:\n        raise SystemExit(\"Okunacak metin yok.\")\n    seed = int(hashlib.sha1(text.encode(\"utf-8\")).hexdigest()[:8], 16)\n    rng = random.Random(seed + 7)\n\n    tmp = tempfile.mkdtemp(prefix=\"bev_ses_\")\n    try:\n        sem = asyncio.Semaphore(4)\n        files = [os.path.join(tmp, \"s%03d.mp3\" % i) for i in range(len(plan))]\n        await asyncio.gather(*[\n            synth_one(p[\"text\"], p[\"voice\"], p[\"rate\"], p[\"pitch\"], p[\"vol\"], f, sem)\n            for p, f in zip(plan, files)\n        ])\n        ff = find_ffmpeg()\n        out_tmp = os.path.join(tmp, \"final.mp3\")\n        if ff:\n            try:\n                stitch_ffmpeg(ff, plan, files, st, bool(args.nefes), out_tmp, rng)\n            except Exception as e:\n                log(\"Uyari: ffmpeg birlestirme basarisiz, sade birlestirme kullaniliyor. \" + str(e))\n                stitch_plain(files, out_tmp)\n        else:\n            log(\"Uyari: ffmpeg bulunamadi; nefes ve duraklama eklenemedi (sade birlestirme).\")\n            stitch_plain(files, out_tmp)\n        os.makedirs(os.path.dirname(os.path.abspath(args.out)), exist_ok=True)\n        shutil.move(out_tmp, args.out)\n    finally:\n        shutil.rmtree(tmp, ignore_errors=True)\n\n\ndef main():\n    ap = argparse.ArgumentParser(description=\"Bilgi Evreni 4D dogal ses motoru (Microsoft Emel Neural)\")\n    ap.add_argument(\"--text-file\", required=True, help=\"UTF-8 metin dosyasi\")\n    ap.add_argument(\"--out\", required=True, help=\"cikis .mp3 yolu\")\n    ap.add_argument(\"--lang\", default=\"tr-TR\", choices=[\"tr-TR\", \"en-US\"])\n    ap.add_argument(\"--style\", default=\"ders\", choices=sorted(STYLES.keys()))\n    ap.add_argument(\"--nefes\", type=int, default=1, help=\"1: nefes sesi ekle, 0: ekleme\")\n    args = ap.parse_args()\n    try:\n        if sys.platform == \"win32\":\n            asyncio.set_event_loop_policy(asyncio.WindowsSelectorEventLoopPolicy())\n        asyncio.run(main_async(args))\n    except SystemExit:\n        raise\n    except Exception as e:\n        log(\"HATA: %s\" % e)\n        sys.exit(1)\n\n\nif __name__ == \"__main__\":\n    main()\n";

/* ---------- Doğal ses: Microsoft Emel Neural (sunucu + Python edge-tts), yedek: tarayıcı sesi ---------- */
const voice = {audio:null, tok:0, fail:0, cache:new Map()};
function browserSpeak(text, lang){
  if(!('speechSynthesis' in window)){toast('Tarayıcın sesli okumayı desteklemiyor.');return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);const l=lang||'tr-TR';u.lang=l;u.rate=.9;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith(l.slice(0,2).toLowerCase()));
  if(v)u.voice=v;speechSynthesis.speak(u);
}
async function ttsFetch(text, lang, style){
  const key=lang+'|'+style+'|'+text;
  if(voice.cache.has(key))return voice.cache.get(key);
  const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,lang,style})});
  if(!r.ok){const e=new Error('tts '+r.status);e.status=r.status;throw e;}
  const url=URL.createObjectURL(await r.blob());
  if(voice.cache.size>=80){const k=voice.cache.keys().next().value;URL.revokeObjectURL(voice.cache.get(k));voice.cache.delete(k);}
  voice.cache.set(key,url);
  return url;
}
function serverVoiceOn(){return location.protocol!=='file:'&&Date.now()>voice.fail;}
function speak(text, lang, style){
  stopSpeak();
  const tok=++voice.tok;lang=lang||'tr-TR';
  if(!serverVoiceOn()){browserSpeak(text,lang);return;}
  const a=new Audio();voice.audio=a;   // tıklama anında oluşturulur: tarayıcı otomatik oynatma engelini aşar
  const slow=setTimeout(()=>{if(tok===voice.tok)toast('🎙️ Emel sesi hazırlanıyor...');},700);
  ttsFetch(text,lang,style||'ders').then(url=>{
    clearTimeout(slow);if(tok!==voice.tok)return;
    a.src=url;a.onended=()=>{if(voice.audio===a)voice.audio=null;};
    return a.play();
  }).catch(e=>{
    clearTimeout(slow);if(tok!==voice.tok)return;
    voice.audio=null;
    if(e&&e.name==='NotAllowedError'){toast('🔊 Sesi başlatmak için düğmeye tekrar tıkla.');return;}
    if(e&&e.status===503){voice.fail=Date.now()+60000;toast('ℹ️ Emel sesi kapalı (Python/edge-tts yok). Tarayıcı sesi kullanılıyor.');}
    else voice.fail=Date.now()+15000;
    browserSpeak(text,lang);
  });
}
function prefetchVoice(text, lang, style){
  if(!serverVoiceOn())return;
  ttsFetch(text,lang||'tr-TR',style||'ders').catch(e=>{if(e&&e.status===503)voice.fail=Date.now()+60000;});
}
function stopSpeak(){
  voice.tok++;if(window.Lesson)Lesson.stop();
  if(voice.audio){try{voice.audio.pause();}catch(e){}voice.audio=null;}
  if('speechSynthesis' in window)speechSynthesis.cancel();
}
window.speak = speak;

let db = null;
const syncState = {server:false,last:0};
let pushT = null, pendingRender = false;
function loadLocal(){try{const r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function save(){db.updatedAt=Date.now();try{localStorage.setItem(LS_KEY,JSON.stringify(db));}catch(e){}pushSoon();}
function pushSoon(){clearTimeout(pushT);pushT=setTimeout(()=>pushNow(false),400);}
async function pushNow(force){
  if(location.protocol==='file:'){updSync();return;}
  try{
    const r=await fetch('/api/db',{method:'POST',headers:{'Content-Type':'application/json','X-Force':force?'1':'0'},body:JSON.stringify(db)});
    if(r.status===409){const j=await r.json();if(j.db)adopt(j.db,true);}
    else if(r.ok){syncState.server=true;syncState.last=Date.now();}
  }catch(e){syncState.server=false;}
  updSync();
}
async function pullNow(initial){
  if(location.protocol==='file:'){updSync();return;}
  try{
    const r=await fetch('/api/db',{cache:'no-store'});const j=await r.json();syncState.server=true;
    if(!j.db){await pushNow(false);}
    else{const sv=j.db.updatedAt||0,lc=db.updatedAt||0;if(sv>lc)adopt(j.db,!initial);else if(sv<lc)await pushNow(false);}
    syncState.last=Date.now();
  }catch(e){syncState.server=false;}
  if(pendingRender&&safeToRender()){pendingRender=false;render();}
  updSync();
}
function safeToRender(){
  const ae=document.activeElement;
  if(ae&&['INPUT','TEXTAREA','SELECT'].includes(ae.tagName))return false;
  if(exam.active||exam.result)return false;
  if(!$('#modal').classList.contains('hidden'))return false;
  return true;
}
function adopt(d,doRender){
  db=normalize(d);try{localStorage.setItem(LS_KEY,JSON.stringify(db));}catch(e){}
  if(session.uid&&!byId(session.uid)){session={uid:null,stack:[]};saveSession();}
  if(doRender){if(safeToRender())render();else pendingRender=true;}
}
function updSync(){const e=$('#syncBadge');if(e)e.innerHTML=location.protocol==='file:'?'💾 Yerel mod':(syncState.server?'🟢 Sunucu bağlı':'🟠 Sunucuya ulaşılamıyor');const s=$('#syncInfo');if(s)s.innerHTML=syncInfoText();}
function syncInfoText(){return (location.protocol==='file:'?'💾 Dosya olarak açıldı: veriler sadece bu tarayıcının LocalStorage alanında tutulur.':(syncState.server?'🟢 Sunucu bağlı. Son eşitleme: '+(syncState.last?fmtDate(syncState.last):'-'):'🟠 Sunucuya ulaşılamıyor; veriler LocalStorage\'da tutuluyor ve sunucu gelince eşitlenecek.'));}

function resetTransient(){
  exam.active=false;exam.result=null;clearInterval(exam.timer);
  lab.mod='m1';lab.qid=null;lab.answered=null;ui.chat=null;ui.q='';ui.role='';
  ui.admClassFilter='';ui.admBankPool='all';ui.admBankSub='all';
  ui.tab={student:0,teacher:0,parent:0,admin:0};ui.activeCourse='turkce';ui.courseTerm='all';ui.courseSearch='';ui.courseStatus='all';ui.loginTab='login';stopSpeak();
}
function roleAvatar(u,size){const it=ITEMS.find(i=>i.id===u.frame);return `<span class="avatar ${it?it.cls:''}" style="--s:${size||44}px">${ROLE_ICON[u.role]||'🙂'}</span>`;}
function tabs(role,names){return `<div class="tabs">${names.map((n,i)=>`<button class="tab ${ui.tab[role]===i?'on':''}" onclick="A.tab('${role}',${i})">${n}</button>`).join('')}</div>`;}
A.tab=(r,i)=>{ui.tab[r]=i;render();};

function render(){
  if(window.CoursePlayer)CoursePlayer.stopAudio();
  if(window.Lesson)Lesson.reset();if(window.Lab3D)Lab3D.dispose();
  if(chart){chart.destroy();chart=null;}
  const u=cur();
  document.body.classList.toggle('hasImp',session.stack.length>0&&!!u);
  drawImpBar();
  const app=$('#app');
  if(!u){app.innerHTML=loginView();updSync();return;}
  const views={student:studentView,teacher:teacherView,parent:parentView,admin:adminView};
  app.innerHTML=header(u)+views[u.role](u);
  updSync();
  if(u.role==='parent')drawChart(u);
  if(u.role==='student'){
    if(ui.tab.student===1)mountLab();
    if(exam.active&&ui.tab.student===2)tickExam();
  }
}
function header(u){
  return `<div class="topbar"><div class="logo">🌌 Bilgi Evreni <b>4D</b> Ultimate</div><div class="who"><small id="syncBadge"></small>${roleAvatar(u)}<div><b>${esc(u.name)}</b><small>${ROLE[u.role]}${u.role==='student'?' • Seviye '+level(u.xp):''}${u.classId?' • '+esc(u.classId):''}</small></div><button class="btn ghost sm" onclick="A.logout()">🚪 Çıkış</button></div></div>`;
}

A.login = () => {
  const un = ($('#lu') ? $('#lu').value : '').trim().toLowerCase();
  const pw = $('#lp') ? $('#lp').value : '';
  const rem = $('#lrem') ? $('#lrem').checked : false;
  const u = db.users.find(x => x.username.toLowerCase() === un && x.password === pw);
  if (!u) { toast('❌ Kullanıcı adı veya şifre hatalı'); return; }
  if (rem) {
    try { localStorage.setItem('be4d_saved_user', un); } catch (e) {}
  } else {
    try { localStorage.removeItem('be4d_saved_user'); } catch (e) {}
  }
  startSession(u.id);
};
A.registerStudent = () => {
  const name = ($('#regName') ? $('#regName').value : '').trim();
  const un = ($('#regUser') ? $('#regUser').value : '').trim().toLowerCase();
  const cls = $('#regClass') ? $('#regClass').value : '4-A';
  const pw = ($('#regPw') ? $('#regPw').value : '').trim();

  if (!name || !un || !pw) {
    toast('⚠️ Lütfen Ad Soyad, Kullanıcı Adı ve Şifre alanlarını doldurun.');
    return;
  }
  if (pw.length < 3) {
    toast('⚠️ Şifreniz en az 3 karakter olmalıdır.');
    return;
  }
  if (db.users.some(x => x.username.toLowerCase() === un)) {
    toast('❌ Bu kullanıcı adı zaten kullanılıyor. Başka bir kullanıcı adı seçin.');
    return;
  }

  const newStudent = {
    id: 'u_' + Date.now(),
    username: un,
    password: pw,
    name: name,
    role: 'student',
    classId: cls,
    avatar: '🧒',
    xp: 0,
    gold: 50,
    totalGold: 50,
    title: 'Yeni Kâşif',
    inventory: [],
    labDone: [],
    courseProgress: {},
    stats: {},
    examHistory: []
  };

  db.users.push(newStudent);
  save();
  toast(`🎉 Hoş geldin ${name}! Hesabın oluşturuldu.`);
  startSession(newStudent.id);
};

function startSession(id){session={uid:id,stack:[]};saveSession();resetTransient();render();}

/* ---------- Hesaba geç / geri dön ---------- */
function canImp(t){const v=cur();if(!v||!t||t.id===v.id)return false;if(v.role==='admin')return true;return v.role==='teacher'&&['student','parent'].includes(t.role)&&t.classId===v.classId;}
A.imp=id=>{const t=byId(id);if(!canImp(t)){toast('Bu hesaba geçiş yetkiniz yok.');return;}const v=cur();session.stack.push(v.id);session.uid=t.id;saveSession();exam.active=false;exam.result=null;clearInterval(exam.timer);lab.qid=null;ui.tab[t.role]=0;render();window.scrollTo(0,0);};
A.back=()=>{const p=session.stack.pop();if(p&&byId(p))session.uid=p;else session={uid:null,stack:[]};saveSession();exam.active=false;exam.result=null;clearInterval(exam.timer);render();};
function drawImpBar(){
  const bar=$('#impBar'),u=cur();
  if(!session.stack.length||!u){bar.classList.add('hidden');bar.innerHTML='';return;}
  const origin=byId(session.stack[session.stack.length-1]);
  bar.classList.remove('hidden');
  bar.innerHTML=`<button class="btn" style="background:#111" onclick="A.back()">${origin&&origin.role==='admin'?'👑 Admin Görünümüne Geri Dön':'👩‍🏫 Öğretmen Görünümüne Geri Dön'}</button><span>Şu an <b>${esc(u.name)}</b> (${ROLE[u.role]}) hesabını görüntülüyorsunuz</span>`;
}

/* ---------- Ödül ---------- */
function gain(u,xp,g){
  const before=level(u.xp);u.xp+=xp;u.gold+=g;u.totalGold+=g;
  toast(`⭐ +${xp} XP &nbsp; 🪙 +${g} Altın${level(u.xp)>before?' &nbsp; 🎉 Seviye '+level(u.xp)+'!':''}`);
}
function refreshStat(){const e=$('#statbar');if(e)e.outerHTML=statsBar(cur());}
function bumpStat(u,subject,ok){const s=u.stats[subject]||(u.stats[subject]={c:0,t:0});s.t++;if(ok)s.c++;}

function statsBar(u){return `<div class="statbar" id="statbar"><div class="chip">⭐ XP <b>${u.xp}</b></div><div class="chip">🎖️ Seviye <b>${level(u.xp)}</b></div><div class="chip">🪙 Altın <b>${u.gold}</b></div>${u.title?`<div class="chip">🏷️ ${esc(u.title)}</div>`:''}<div class="xpbar" title="Sonraki seviyeye: ${100-u.xp%100} XP"><i style="width:${u.xp%100}%"></i></div></div>`;}

  const go=()=>{if(!$('#labStage'))return;Lab3D.mount($('#labStage'));A.selMod(lab.mod,true);};

  setTimeout(()=>{const c=$('#labCanvas');if(c&&!window.Lab3D)c.innerHTML='<p style="padding:24px">⚠️ 3D motoru (Three.js) yüklenemedi. İnternet bağlantını kontrol et ve sayfayı yenile.</p>';},8000);
}

A.selMod=(id,keep)=>{
  lab.mod=id;stopSpeak();
  MODULES.forEach(m=>{const b=$('#mb_'+m.id);if(b)b.classList.toggle('on',m.id===id);});
  const m=modById(id);
  if($('#labTitle'))$('#labTitle').textContent=m.icon+' '+m.name;
  if($('#labTopic'))$('#labTopic').textContent=m.topic;
  if(window.Lab3D)Lab3D.load(id);
  A.newQ();
  setTimeout(()=>{if(lab.mod===id)prefetchVoice(m.name+'. '+m.topic,'tr-TR','ders');},1500);
  if(window.Lesson){Lesson.poster();Lesson.prefetch(id);}   // konu sesi arka planda hazırlanır
};

const ttsPending = new Map();
function ttsGet(text, lang, style){
  const key = lang + '|' + style + '|' + text;
  if (voice.cache.has(key)) return Promise.resolve(voice.cache.get(key));
  if (ttsPending.has(key)) return ttsPending.get(key);
  const p = ttsFetch(text, lang, style);
  ttsPending.set(key, p);
  const clr = () => ttsPending.delete(key);
  p.then(clr, clr);
  return p;
}

const Lesson = (() => {
  const L = {
    tok: 0, rtok: 0, bg: 0, el: null, ctx: null, phase: 'idle', mod: null, 
    onPick: null, reread: null, music: null, musicOn: localStorage.getItem('bev_music') !== '0',
    curStep: 0, speed: 1.0, showSlide: true, subsOn: true, paused: false, resumeCb: null
  };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const stg = () => $('#labStage'), lyr = () => $('#lsn');
  const ascii = s => /^[\x00-\x7F]+$/.test(String(s));
  const SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';

  /* ---- ses: kilit açma, durdurma, efektler, müzik ---- */
  function unlock(){
    if (!L.el) L.el = new Audio();
    try { L.el.src = SILENT; const p = L.el.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
    try {
      if (!L.ctx){ const C = window.AudioContext || window.webkitAudioContext; if (C) L.ctx = new C(); }
      if (L.ctx && L.ctx.state === 'suspended') L.ctx.resume();
    } catch (e) {}
  }
  function halt(){
    try { if (L.el) L.el.pause(); } catch (e) {}
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    L.paused = false; L.resumeCb = null;
  }
  function tone(f, t0, d, type, vol, dest){
    const c = L.ctx; if (!c) return;
    const o = c.createOscillator(), g = c.createGain(), n = c.currentTime + t0;
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, n); g.gain.exponentialRampToValueAtTime(vol || .15, n + .02); g.gain.exponentialRampToValueAtTime(.0001, n + d);
    o.connect(g); g.connect(dest || c.destination); o.start(n); o.stop(n + d + .05);
  }
  function sfx(k){
    if (!L.ctx) return;
    if (k === 'ok'){ tone(784, 0, .18, 'triangle'); tone(1047, .12, .28, 'triangle'); tone(1319, .26, .45, 'triangle'); }
    else if (k === 'bad'){ tone(220, 0, .25, 'sawtooth', .07); tone(165, .18, .4, 'sawtooth', .07); }
    else if (k === 'win'){ [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * .11, .35, 'triangle', .16)); }
    else if (k === 'pop'){ tone(880, 0, .12, 'sine', .1); }
  }
  function musicStart(){
    if (!L.ctx || !L.musicOn || L.music) return;
    const c = L.ctx, m = c.createGain(); m.gain.value = 1; m.connect(c.destination);
    const sc = [392, 440, 523.25, 587.33, 659.25, 783.99], pat = [0, 2, 4, 2, 5, 4, 2, 1]; let k = 0;
    const id = setInterval(() => {
      if (!L.ctx || L.ctx.state !== 'running' || L.paused) return;
      const f = sc[pat[k % 8]] * (Math.floor(k / 8) % 2 ? 1 : .5);
      tone(f, 0, .5, 'triangle', .028, m); if (k % 4 === 0) tone(f / 2, 0, .9, 'sine', .03, m); k++;
    }, 380);
    L.music = {id, m};
  }
  function musicStop(){ if (L.music){ clearInterval(L.music.id); try { L.music.m.disconnect(); } catch (e) {} L.music = null; } }
  function musicToggle(){
    L.musicOn = !L.musicOn; try { localStorage.setItem('bev_music', L.musicOn ? '1' : '0'); } catch (e) {}
    const b = $('#lsnMus'); if (b) b.textContent = L.musicOn ? '🎵' : '🔇';
    if (L.musicOn){ if (L.phase === 'lesson') musicStart(); } else musicStop();
  }

  /* ---- görsel efektler ---- */
  function confetti(n){
    const st = stg(); if (!st) return;
    const old = $('#cfx'); if (old) old.remove();
    const cv = document.createElement('canvas'); cv.id = 'cfx';
    cv.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:40';
    st.appendChild(cv);
    const w = cv.width = st.clientWidth, h = cv.height = st.clientHeight, g = cv.getContext('2d');
    const cols = ['#ffca28', '#ef5350', '#42a5f5', '#66bb6a', '#ab47bc', '#ff7043', '#26c6da'];
    const P = Array.from({length: n || 110}, () => ({x: w / 2 + (Math.random() - .5) * w * .3, y: h * .55, vx: (Math.random() - .5) * 10, vy: -Math.random() * 12 - 3, s: 6 + Math.random() * 7, c: cols[Math.floor(Math.random() * cols.length)], r: Math.random() * 6, vr: (Math.random() - .5) * .4}));
    let t = 0;
    const f = () => {
      if (!cv.isConnected) return;
      g.clearRect(0, 0, w, h);
      P.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += p.vr; g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); g.restore(); });
      if (++t < 120) requestAnimationFrame(f); else cv.remove();
    };
    f();
  }
  function popEmoji(e){ const l = lyr(); if (!l) return; const s = document.createElement('div'); s.className = 'emopop'; s.textContent = e; l.appendChild(s); setTimeout(() => s.remove(), 1500); }
  const setCap = (t, tag) => { 
    // Altyazı balonu kaldırıldı: ders anlatımı yalnızca seslidir (Emel TTS), 3D sahne engellenmez.
    const st = $('#lsnStepTitle'); if (st && tag) st.textContent = tag;
  };
  const owl = on => { const o = $('#lsnOwl'); if (o) o.classList.toggle('talk', !!on); };

  /* ---- anlatım: önce Emel (sunucu), olmazsa tarayıcı sesi, o da yoksa süre tahmini ---- */
  function narrate(text, lang, style, alive, cb){
    cb = cb || {};
    return new Promise(res => {
      const finish = () => {
        if (L.paused) { L.resumeCb = res; } else { res(); }
      };
      const est = Math.max(1.2, text.length * .075) / (L.speed || 1);
      const browser = () => {
        if (!alive()) return finish();
        if (cb.start) cb.start(est);
        if (!('speechSynthesis' in window)){ setTimeout(finish, est * 1000 + 400); return; }
        try {
          speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text); u.lang = lang; u.rate = .92 * (L.speed || 1);
          const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith(lang.slice(0, 2).toLowerCase()));
          if (v) u.voice = v; u.onend = () => finish(); u.onerror = () => finish();
          speechSynthesis.speak(u); setTimeout(finish, est * 1000 + 6000);
        } catch (e) { setTimeout(finish, est * 1000); }
      };
      if (!serverVoiceOn()){ browser(); return; }
      if (!L.el) L.el = new Audio();
      const wt = setTimeout(() => { if (alive() && cb.wait) cb.wait(); }, 450);
      ttsGet(text, lang, style).then(url => {
        clearTimeout(wt); if (!alive()) return finish();
        const el = L.el; el.onended = () => finish(); el.onerror = () => finish(); el.src = url;
        el.playbackRate = L.speed || 1.0;
        return el.play().then(() => { if (cb.start) cb.start((isFinite(el.duration) && el.duration > 0 ? el.duration : est) / (L.speed || 1)); })
          .catch(e => { if (!alive()) return finish(); if (e && e.name === 'NotAllowedError') toast('🔊 Sesi başlatmak için ekrana bir kez dokun.'); browser(); });
      }).catch(e => {
        clearTimeout(wt); if (!alive()) return finish();
        if (e && e.status === 503) voice.fail = Date.now() + 60000; else voice.fail = Date.now() + 15000;
        browser();
      });
    });
  }

  /* ---- sahne komutları ---- */
  function doAct(d){ if (!window.Lab3D) return; if (d[0] === 'set') Lab3D.setParam(d[1], d[2]); else if (d[0] === 'act') Lab3D.act(d[1]); }
  function applyStep(s, i, steps){
    L.curStep = i;
    (s.do || []).forEach(doAct);
    if (s.cam && window.Lab3D) Lab3D.camTo(s.cam, s.tgt, 1600);
    if (s.emo) popEmoji(s.emo);

    const ch = $('#lsnChapter'); if (ch && steps) ch.textContent = `· Adım ${i + 1} / ${steps.length}`;
    const sb = $('#lsnStepBadge'); if (sb) sb.textContent = s.badge ? `📌 ${s.badge}` : '';
    const st = $('#lsnStepTitle'); if (st) st.textContent = s.title || '';
    const bar = $('#lsnBar'); if (bar && steps) bar.style.width = ((i + 1) / steps.length * 100) + '%';

    const sc = $('#lsnSlideCard');
    if (sc) {
      if (s.slide && L.showSlide) {
        const img = $('#lsnSlideImg'), tit = $('#lsnSlideTitle');
        if (img) img.src = s.slide;
        if (tit) tit.textContent = '📌 ' + (s.slideTitle || s.title || 'Ders Şeması');
        sc.classList.add('show');
      } else {
        sc.classList.remove('show');
      }
    }
  }
  function ramp(r, ms, tok){
    if (!window.Lab3D) return;
    const t0 = performance.now();
    const f = now => {
      if (tok !== L.tok) return;
      const k = Math.min(1, (now - t0) / ms);
      Lab3D.setParam(r[0], r[1] + (r[2] - r[1]) * k);
      if (k < 1) requestAnimationFrame(f);
    };
    requestAnimationFrame(f);
  }
