name: yenisitemarkasi
description: Yedek Parça E-Ticaret Web Sitesi ve Admin Paneli (yedekparca.com.tr klonu)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
    
  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.1.0
  
  # Backend & Network
  supabase_flutter: ^2.5.2
  http: ^1.2.1
  html: ^0.15.4
  
  # UI & Design
  google_fonts: ^6.2.1
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
