services:
  - type: web
    name: esrakocmersin-github-io
    env: node
    plan: free
    buildCommand: ""
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        value: https://esrakocmersin.github.io
